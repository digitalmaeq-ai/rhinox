name: Code Studio V2 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/coding-robotics/code-studio/learn/**"
      - "app/coding-robotics/code-studio/workspace/**"
      - "app/components/code-studio-v2/**"
      - "lib/code-studio-v2/**"
      - "scripts/import-code-studio-curriculum.mjs"
      - "scripts/test-code-studio-curriculum-import.mjs"
      - "scripts/test-private-curriculum-loader.mjs"
      - "scripts/test-code-studio-robot-simulator.mjs"
      - "scripts/test-code-studio-conditional-program.mjs"
      - "scripts/test-code-studio-text-parser.mjs"
      - "scripts/test-code-studio-lesson-gates.mjs"
      - ".github/workflows/code-studio-v2-checks.yml"
      - ".gitignore"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "docs/product/rhinox-code-studio-v2-*.md"
  push:
    branches: ["product/rhinox-code-studio-v2"]
    paths:
      - "app/coding-robotics/code-studio/learn/**"
      - "app/coding-robotics/code-studio/workspace/**"
      - "app/components/code-studio-v2/**"
      - "lib/code-studio-v2/**"
      - "scripts/import-code-studio-curriculum.mjs"
      - "scripts/test-code-studio-curriculum-import.mjs"
      - "scripts/test-private-curriculum-loader.mjs"
      - "scripts/test-code-studio-robot-simulator.mjs"
      - "scripts/test-code-studio-conditional-program.mjs"
      - "scripts/test-code-studio-text-parser.mjs"
      - "scripts/test-code-studio-lesson-gates.mjs"
      - ".github/workflows/code-studio-v2-checks.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "docs/product/rhinox-code-studio-v2-*.md"

permissions:
  contents: read

concurrency:
  group: code-studio-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Preserve baseline dependency lockfile
        run: git show "${GITHUB_SHA}^:package-lock.json" > "$RUNNER_TEMP/package-lock-before.json"
      - name: Install dependencies
        run: |
          npm install
          npm audit fix || true
      - name: Report dependency security advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories: (item.via ?? []).filter(v => typeof v === "object").map(v => ({
                  title: v.title,
                  url: v.url,
                  range: v.range
                }))
              }));
            }
          '
      - name: Validate curriculum importer
        run: node scripts/test-code-studio-curriculum-import.mjs
      - name: Test private curriculum access boundary
        run: node --experimental-strip-types scripts/test-private-curriculum-loader.mjs
      - name: Test robot simulator
        run: node --experimental-strip-types scripts/test-code-studio-robot-simulator.mjs
      - name: Test runtime conditional execution
        run: node --experimental-strip-types scripts/test-code-studio-conditional-program.mjs
      - name: Test safe text-code parser
        run: node --experimental-strip-types scripts/test-code-studio-text-parser.mjs
      - name: Test lesson eligibility and core part gates
        run: node --experimental-strip-types scripts/test-code-studio-lesson-gates.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Export dependency lockfile changes
        if: always()
        shell: bash
        run: |
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const oldLock = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/package-lock-before.json", "utf8"));
            const newLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const changedPackages = {};
            for (const [path, value] of Object.entries(newLock.packages ?? {})) {
              if (JSON.stringify(oldLock.packages?.[path]) !== JSON.stringify(value)) changedPackages[path] = value;
            }
            const removedPackages = Object.keys(oldLock.packages ?? {}).filter(path => !(path in (newLock.packages ?? {})));
            fs.writeFileSync("lockfile-changes.json", JSON.stringify({
              rootPackage: newLock.packages?.[""],
              changedPackages,
              removedPackages
            }, null, 2) + "\n");
            console.log("Changed lockfile package entries:", Object.keys(changedPackages).length);
            console.log("Removed lockfile package entries:", removedPackages.length);
          '
      - name: Upload audited lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-studio-v2-audited-lockfile
          path: |
            package-lock.json
            lockfile-changes.json
          retention-days: 1
