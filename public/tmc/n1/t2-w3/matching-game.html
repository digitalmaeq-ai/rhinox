<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 2 · Week 3</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found them all! Now tap the machine that beeps a pattern.</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Yes! The microwave beeps when the food is ready!</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"beep": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"20\" y=\"58\" width=\"128\" height=\"84\" rx=\"40\" fill=\"#F7931E\"/><path d=\"M50 138 L40 168 L76 140Z\" fill=\"#F7931E\"/><text x=\"84\" y=\"112\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"34\" fill=\"#ffffff\">beep</text><path d=\"M150 70 Q162 100 150 130\" stroke=\"#F7931E\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" opacity=\"1.0\"/><path d=\"M162 70 Q174 100 162 130\" stroke=\"#F7931E\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.75\"/><path d=\"M174 70 Q186 100 174 130\" stroke=\"#F7931E\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.5\"/></svg>", "microwave": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><rect x=\"20\" y=\"52\" width=\"160\" height=\"104\" rx=\"10\" fill=\"#E3E9EF\" stroke=\"#16324F\" stroke-width=\"5\"/><rect x=\"32\" y=\"64\" width=\"98\" height=\"80\" rx=\"6\" fill=\"#3a3a3a\"/><rect x=\"38\" y=\"70\" width=\"86\" height=\"68\" rx=\"4\" fill=\"#ffb24d\" opacity=\".5\"/><rect x=\"140\" y=\"66\" width=\"30\" height=\"14\" rx=\"3\" fill=\"#3BB273\"/><circle cx=\"148\" cy=\"98\" r=\"5\" fill=\"#16324F\"/><circle cx=\"162\" cy=\"98\" r=\"5\" fill=\"#16324F\"/><circle cx=\"148\" cy=\"116\" r=\"5\" fill=\"#16324F\"/><circle cx=\"162\" cy=\"116\" r=\"5\" fill=\"#16324F\"/><path d=\"M170 40 Q178 30 170 20\" stroke=\"#F7931E\" stroke-width=\"4\" fill=\"none\"/><path d=\"M178 40 Q186 30 178 20\" stroke=\"#F7931E\" stroke-width=\"4\" fill=\"none\"/></svg>", "empty": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F7F9FC\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#9aa9b8\" stroke-width=\"5\" stroke-dasharray=\"10 8\"/></svg>", "shaker": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><rect x=\"78\" y=\"30\" width=\"44\" height=\"24\" rx=\"6\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M72 54 L128 54 L136 82 L136 168 Q136 176 128 176 L72 176 Q64 176 64 168 L64 82Z\" fill=\"#cfe9fb\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><circle cx=\"84\" cy=\"150\" r=\"5\" fill=\"#B5651D\"/><circle cx=\"100\" cy=\"158\" r=\"5\" fill=\"#B5651D\"/><circle cx=\"116\" cy=\"150\" r=\"5\" fill=\"#B5651D\"/><circle cx=\"92\" cy=\"140\" r=\"5\" fill=\"#B5651D\"/><circle cx=\"110\" cy=\"138\" r=\"5\" fill=\"#B5651D\"/><circle cx=\"100\" cy=\"146\" r=\"5\" fill=\"#B5651D\"/><circle cx=\"88\" cy=\"160\" r=\"5\" fill=\"#B5651D\"/><circle cx=\"114\" cy=\"162\" r=\"5\" fill=\"#B5651D\"/><text x=\"100\" y=\"118\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"13\" fill=\"#16324F\">SEALED</text><path d=\"M54 70 L38 60\" stroke=\"#8E5BD9\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M146 70 L162 60\" stroke=\"#8E5BD9\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>", "toy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"112\" r=\"46\" fill=\"#C68642\"/><circle cx=\"62\" cy=\"64\" r=\"18\" fill=\"#C68642\"/><circle cx=\"138\" cy=\"64\" r=\"18\" fill=\"#C68642\"/><circle cx=\"62\" cy=\"64\" r=\"9\" fill=\"#E8B07A\"/><circle cx=\"138\" cy=\"64\" r=\"9\" fill=\"#E8B07A\"/><circle cx=\"100\" cy=\"80\" r=\"34\" fill=\"#C68642\"/><ellipse cx=\"100\" cy=\"92\" rx=\"14\" ry=\"10\" fill=\"#E8B07A\"/><circle cx=\"100\" cy=\"88\" r=\"4\" fill=\"#1d1d1d\"/><circle cx=\"88\" cy=\"74\" r=\"4\" fill=\"#1d1d1d\"/><circle cx=\"112\" cy=\"74\" r=\"4\" fill=\"#1d1d1d\"/><ellipse cx=\"100\" cy=\"128\" rx=\"24\" ry=\"20\" fill=\"#E8B07A\"/><path d=\"M86 110 L100 118 L114 110 L114 122 L100 116 L86 122Z\" fill=\"#168fe5\"/></svg>", "ear": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><path d=\"M126 60 Q126 30 96 30 Q60 30 60 70 Q60 96 80 110 Q96 122 92 150 Q90 170 110 170 Q130 170 132 150\" stroke=\"#16324F\" stroke-width=\"8\" fill=\"#8D5524\" stroke-linecap=\"round\"/><path d=\"M80 72 Q84 54 100 56 Q114 60 108 80 Q102 92 96 100\" stroke=\"#16324F\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M148 90 Q156 104 148 118\" stroke=\"#F7931E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M160 90 Q168 104 160 118\" stroke=\"#F7931E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "eye": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M24 100 Q100 30 176 100 Q100 170 24 100Z\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"7\"/><circle cx=\"100\" cy=\"100\" r=\"30\" fill=\"#6B3F1A\"/><circle cx=\"100\" cy=\"100\" r=\"14\" fill=\"#1d1d1d\"/><circle cx=\"90\" cy=\"90\" r=\"6\" fill=\"#ffffff\"/></svg>", "clap": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><g transform=\"rotate(-18 92 104)\"><rect x=\"66\" y=\"56\" width=\"40\" height=\"80\" rx=\"20\" fill=\"#8D5524\"/></g><g transform=\"rotate(18 108 104)\"><rect x=\"96\" y=\"56\" width=\"40\" height=\"80\" rx=\"20\" fill=\"#6B3F1A\"/></g><path d=\"M60 40 L48 26\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M100 30 L100 12\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M140 40 L152 26\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M44 80 L28 76\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M156 80 L172 76\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><rect x=\"70\" y=\"140\" width=\"60\" height=\"30\" rx=\"12\" fill=\"#F7931E\"/></svg>", "car": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><path d=\"M30 130 L42 96 Q48 84 62 84 L128 84 Q142 84 150 96 L166 120 L176 124 L176 146 L24 146 L24 132Z\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M58 96 L96 96 L96 118 L50 118Z\" fill=\"#cfe9fb\"/><path d=\"M104 96 L134 96 L148 118 L104 118Z\" fill=\"#cfe9fb\"/><circle cx=\"60\" cy=\"148\" r=\"16\" fill=\"#333\"/><circle cx=\"144\" cy=\"148\" r=\"16\" fill=\"#333\"/><path d=\"M20 70 L8 70 M14 64 L8 70 L14 76\" stroke=\"#F7931E\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"58\" y=\"56\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"18\" fill=\"#F7931E\">beep beep</text></svg>", "stamp": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"84\" y=\"30\" width=\"30\" height=\"96\" rx=\"14\" fill=\"#16324F\"/><path d=\"M70 120 Q72 104 90 104 L118 104 Q150 108 152 132 L152 146 L66 146 Z\" fill=\"#F7931E\"/><rect x=\"62\" y=\"142\" width=\"96\" height=\"10\" rx=\"5\" fill=\"#1d1d1d\"/><path d=\"M40 168 L160 168\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M48 150 L30 140\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M164 150 L180 140\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M44 128 L24 124\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M168 128 L186 124\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/></svg>", "boop": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><rect x=\"20\" y=\"58\" width=\"128\" height=\"84\" rx=\"40\" fill=\"#168fe5\"/><path d=\"M50 138 L40 168 L76 140Z\" fill=\"#168fe5\"/><text x=\"84\" y=\"112\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"34\" fill=\"#ffffff\">boop</text><path d=\"M150 70 Q162 100 150 130\" stroke=\"#168fe5\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" opacity=\"1.0\"/><path d=\"M162 70 Q174 100 162 130\" stroke=\"#168fe5\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.75\"/><path d=\"M174 70 Q186 100 174 130\" stroke=\"#168fe5\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.5\"/></svg>", "drum": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M36 150 Q36 80 100 80 Q164 80 164 150 Z\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"5\"/><rect x=\"30\" y=\"146\" width=\"140\" height=\"14\" rx=\"6\" fill=\"#16324F\"/><path d=\"M120 60 L150 30\" stroke=\"#B5651D\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"116\" cy=\"64\" r=\"8\" fill=\"#F7931E\"/><path d=\"M80 66 L74 52\" stroke=\"#F7931E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M92 66 L86 52\" stroke=\"#F7931E\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"};
const CFG = {"names": {"beep": "beep", "boop": "boop", "ear": "ear", "eye": "eye"}, "answer": "microwave", "choices": ["toy", "microwave", "eye"], "ask": "You found them all! Now tap the machine that beeps a pattern.", "yes": "Yes! The microwave beeps when the food is ready!", "no": "Does that beep? Find the machine."}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
