<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayo's Story</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--bg:#F4F9FF;--card:#fff;--ink:#16324F}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--blue);color:var(--navy);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0 8px;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #d8e8f8}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);color:var(--navy);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.round{font-weight:800;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);margin:18px 0}
.slot{aspect-ratio:1/1.1;border:4px dashed #9cc9f0;border-radius:24px;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .num{position:absolute;top:8px;left:12px;font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--blue)}
.slot .lbl{position:absolute;bottom:6px;width:100%;text-align:center;font-weight:800;font-size:clamp(13px,2.6vw,18px);color:#5b7a98}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot svg,.card svg{width:78%;height:auto}
.arrows{display:flex;justify-content:space-around;margin-top:-10px;color:var(--blue);font-size:28px;font-weight:900}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);min-height:120px;margin-top:6px}
.card{border:0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 0 #c9dcef;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #c9dcef}
.card.gone{visibility:hidden}
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:6px auto 0;opacity:.95}
.model div{background:#fff;border-radius:16px;padding:4px;border:3px solid var(--orange);position:relative}
.model div b{position:absolute;top:2px;left:8px;color:var(--orange);font-weight:900}
.model svg{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c9dcef}
.btn[disabled]{opacity:.45;cursor:default}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{display:none;text-align:center;padding:10px}
.win.show{display:block}
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.note{font-size:12px;color:#5b7a98;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Week 8</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>

  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <div><div class="round" id="round">Round 1 of 2</div><p class="say" id="say">Ayo’s market trip is mixed up! Tap the story in order.</p></div>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div id="model" class="model" hidden></div>

  <div class="slots" id="slots"></div>
  
  <div class="tray" id="tray"></div>

  <div class="bar">
    <button class="btn alt" id="undo">↩ Undo</button>
    <button class="btn" id="check" disabled>✔ Check</button>
  </div>

  <div class="win" id="win">
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p class="say" id="winsay"></p>
    <div class="bar"><button class="btn" id="next">Next ▶</button></div>
  </div>

  <p class="note">Works offline once loaded.</p>
</div>

<script>

" width=\"28\" height=\"24\" rx=\"4\" fill=\"#cfe9fb\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"100\" y=\"72\" width=\"28\" height=\"24\" rx=\"4\" fill=\"#cfe9fb\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"134\" y=\"72\" width=\"28\" height=\"24\" rx=\"4\" fill=\"#cfe9fb\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"80\" cy=\"84\" r=\"9\" fill=\"#8D5524\"/><path d=\"M73 78 Q80 61 87 78 Q80 77 73 78Z\" fill=\"#1d1d1d\"/><circle cx=\"71\" cy=\"86\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"89\" cy=\"86\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M71 96 Q80 104 89 96\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"56\" cy=\"146\" r=\"16\" fill=\"#333\"/><circle cx=\"56\" cy=\"146\" r=\"6\" fill=\"#bbb\"/><circle cx=\"146\" cy=\"146\" r=\"16\" fill=\"#333\"/><circle cx=\"146\" cy=\"146\" r=\"6\" fill=\"#bbb\"/><rect x=\"172\" y=\"108\" width=\"12\" height=\"10\" rx=\"3\" fill=\"#F7931E\"/></svg>", "market": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M24 50 L176 50 L166 82 L34 82 Z\" fill=\"#3BB273\"/><path d=\"M44 50 L63 50 L61 82 L46 82Z\" fill=\"#ffffff\"/><path d=\"M82 50 L101 50 L99 82 L84 82Z\" fill=\"#ffffff\"/><path d=\"M120 50 L139 50 L137 82 L122 82Z\" fill=\"#ffffff\"/><rect x=\"34\" y=\"82\" width=\"6\" height=\"90\" fill=\"#B5651D\"/><rect x=\"160\" y=\"82\" width=\"6\" height=\"90\" fill=\"#B5651D\"/><rect x=\"30\" y=\"128\" width=\"140\" height=\"14\" rx=\"4\" fill=\"#B5651D\"/><ellipse cx=\"64\" cy=\"120\" rx=\"16\" ry=\"11\" fill=\"#D9A066\" stroke=\"#8a5a2b\" stroke-width=\"3\"/><ellipse cx=\"100\" cy=\"120\" rx=\"16\" ry=\"11\" fill=\"#D9A066\" stroke=\"#8a5a2b\" stroke-width=\"3\"/><ellipse cx=\"136\" cy=\"120\" rx=\"16\" ry=\"11\" fill=\"#D9A066\" stroke=\"#8a5a2b\" stroke-width=\"3\"/></svg>", "comehome": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><g transform=\"translate(90 60) scale(1)\"><rect x=\"0\" y=\"30\" width=\"70\" height=\"56\" fill=\"#F3D9B1\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M-6 32 L35 0 L76 32Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"26\" y=\"54\" width=\"18\" height=\"32\" fill=\"#B5651D\"/><rect x=\"6\" y=\"42\" width=\"14\" height=\"12\" fill=\"#cfe9fb\"/></g><circle cx=\"56\" cy=\"80\" r=\"15\" fill=\"#8D5524\"/><path d=\"M43 74 Q56 51 69 74 Q56 67 43 74Z\" fill=\"#1d1d1d\"/><circle cx=\"47\" cy=\"82\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"65\" cy=\"82\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M47 92 Q56 100 65 92\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"44\" y=\"95\" width=\"24\" height=\"30\" rx=\"9\" fill=\"#F7931E\"/><path d=\"M50 124 L46 146\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M62 124 L68 146\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M66 104 L84 118\" stroke=\"#8D5524\" stroke-width=\"7\" stroke-linecap=\"round\"/><rect x=\"78\" y=\"112\" width=\"22\" height=\"22\" rx=\"4\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><ellipse cx=\"89\" cy=\"112\" rx=\"9\" ry=\"6\" fill=\"#D9A066\"/><rect x=\"10\" y=\"170\" width=\"180\" height=\"8\" rx=\"4\" fill=\"#cfd8e3\"/></svg>", "bread": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><path d=\"M40 120 Q40 70 100 70 Q160 70 160 120 L160 150 Q160 160 150 160 L50 160 Q40 160 40 150Z\" fill=\"#D9A066\" stroke=\"#8a5a2b\" stroke-width=\"5\"/><path d=\"M70 92 L80 82 M98 90 L108 80 M126 92 L136 82\" stroke=\"#8a5a2b\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M148 120 Q160 108 172 120 Q178 140 160 146 Z\" fill=\"#ffffff\" stroke=\"#8a5a2b\" stroke-width=\"3\"/><circle c 160 96 L160 106\" stroke=\"#16324F\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "water": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M30 192 Q100 70 170 192 Z\" fill=\"#9ED7A8\"/><rect x=\"4\" y=\"180\" width=\"192\" height=\"12\" fill=\"#9ED7A8\"/><rect x=\"80\" y=\"48\" width=\"44\" height=\"40\" rx=\"4\" fill=\"#B8C4D0\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M76 48 L102 26 L128 48\" fill=\"#B5651D\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M86 90 L118 90 L114 118 L90 118Z\" fill=\"#9aa9b8\" stroke=\"#16324F\" stroke-width=\"3\"/><ellipse cx=\"102\" cy=\"92\" rx=\"15\" ry=\"4\" fill=\"#168fe5\"/><circle cx=\"60\" cy=\"80\" r=\"15\" fill=\"#8D5524\"/><path d=\"M47 74 Q60 51 73 74 Q60 67 47 74Z\" fill=\"#1d1d1d\"/><circle cx=\"51\" cy=\"82\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"69\" cy=\"82\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M51 92 Q60 100 69 92\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"48\" y=\"95\" width=\"24\" height=\"30\" rx=\"9\" fill=\"#168fe5\"/><path d=\"M54 124 L50 146\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M66 124 L72 146\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"146\" cy=\"80\" r=\"15\" fill=\"#8D5524\"/><path d=\"M133 74 Q146 51 159 74 Q146 67 133 74Z\" fill=\"#1d1d1d\"/><circle cx=\"137\" cy=\"82\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"155\" cy=\"82\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M137 92 Q146 100 155 92\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"134\" y=\"95\" width=\"24\" height=\"30\" rx=\"9\" fill=\"#8E5BD9\"/><path d=\"M140 124 L136 146\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M152 124 L158 146\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/></svg>", "fall" width=\"8\" stroke-linecap=\"round\"/><path d=\"M76 164 L82 186\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/></g><g transform=\"rotate(140 130 90)\"><circle cx=\"130\" cy=\"70\" r=\"15\" fill=\"#8D5524\"/><path d=\"M117 64 Q130 41 143 64 Q130 57 117 64Z\" fill=\"#1d1d1d\"/><circle cx=\"121\" cy=\"72\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"139\" cy=\"72\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M121 82 Q130 90 139 82\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"118\" y=\"85\" width=\"24\" height=\"30\" rx=\"9\" fill=\"#8E5BD9\"/><path d=\"M124 114 L120 136\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M136 114 L142 136\" stroke=\"#16324F\" stroke-width=\"8\" stroke-linecap=\"round\"/></g><path d=\"M150 50 A20 20 0 1 1 170 70\" stroke=\"#F7931E\" stroke-width=\"4\" fill=\"none\"/></svg>"};
const ROUNDS = [{"say": "Ayo\u2019s market trip is mixed up! Tap the story in order.", "order": ["leavehome", "danfo", "market", "comehome"], "labels": {"leavehome": "leave home", "danfo": "ride the bus", "market": "buy bread", "comehome": "come home"}, "oops": "Oops! What happens at the beginning? Try again.", "win": "First Ayo leaves home. Next he rides the bus. Then he buys bread. Last he comes home!"}, {"say": "Jack and Jill! Tap the rhyme in order.", "order": ["hillup", "water", "fall", "tumble"], "labels": {"hillup": "up the hill", "water": "fetch water", "fall": "fall down", "tumble": "tumble after"}, "oops": "Listen: up the hill, fetch water, fall down, tumble after.", "win": "Up the hill, fetch water, fall down, tumble after!"}, {"say": "Stretch! Five pictures. What happens after Ayo comes home?", "stretch": true, "order": ["leavehome", "danfo", "market", "comehome", "bread"], "labels": {"leavehome": "leave home", "danfo": "ride the bus", "market": "buy bread", "comehome": "come home", "bread": "eat the bread"}, "oops": "Try again: leave home, bus, buy bread, come home, eat!", "win": "Five pictures in order. The end!"}];
const WORDS = n => n===3 ? ["first","next","last"] : ["first", ...Array(n-2).fill("next"), "last"];
let r = 0, placed = [];
const $ = id => document.getElementById(id);

function speak(t){
  try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.rate = .85; u.pitch = 1.1; speechSynthesis.speak(u);}catch(e){}
}
function shuffle(a){ a = a.slice(); do{ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }while(a.join()===ROUNDS[r].order.join()); return a; }

function build(){
  const R = ROUNDS[r]; placed = [];
  $('round').textContent = `Round ${r+1} of ${ROUNDS.length}` + (R.stretch ? ' · Stretch' : '');
  $('say').textContent = R.say;
  $('win').classList.remove('show');
  const m = $('model'); m.hidden = !R.model; m.innerHTML = R.model ? R.order.map((k,i)=>`<div><b>${i+1}</b>${ICONS[k]}</div>`).join('') : '';
  $('slots').style.gridTemplateColumns = `repeat(${R.order.length},1fr)`; $('tray').style.gridTemplateColumns = `repeat(${R.order.length+(R.extra||[]).length},1fr)`;
  $('slots').innerHTML = WORDS(R.order.length).map((w,i)=>`<div class="slot" data-i="${i}"><span class="num">${i+1}</span><span class="lbl">${w}</span></div>`).join('');
  $('tray').innerHTML = shuffle(R.order.concat(R.extra||[])).map(k=>`<button class="card" data-k="${k}" aria-label="${R.labels[k]}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>place(c));
  sync(); speak(R.say);
}
function place(c){
  if(placed.length>=ROUNDS[r].order.length) return;
  placed.push(c.dataset.k); c.classList.add('gone'); speak(ROUNDS[r].labels[c.dataset.k]); sync();
}
function sync(){
  const R = ROUNDS[r];
  document.querySelectorAll('.slot').forEach((s,i)=>{
    const k = placed[i];
    s.classList.toggle('filled', !!k);
    s.querySelectorAll('svg').forEach(x=>x.remove());
    if(k) s.insertAdjacentHTML('beforeend', ICONS[k]);
  });
  $('check').disabled = placed.length<R.order.length;
}
$('undo').onclick = ()=>{ const k = placed.pop(); if(!k) return; const c=document.querySelector(`.card.gone[data-k="${k}"]`); c.classList.remove('gone'); sync(); };
$('check').onclick = ()=>{
  const R = ROUNDS[r];
  if(placed.join()===R.order.join()){
    $('winsay').textContent = R.win; $('win').classList.add('show'); speak("Well done! "+R.win);
    $('next').textContent = r < ROUNDS.length-1 ? 'Next ▶' : 'Play again ↻';
    $('win').scrollIntoView({behavior:'smooth',block:'center'});
  } else {
    $('slots').classList.add('shake'); setTimeout(()=>$('slots').classList.remove('shake'),500);
    const t = R.oops || (R.model ? "Oops! Look at RhinoBot's cards and try again." : "Oops! What does Ayo do first? Try again.");
    $('say').textContent = t; speak(t);
    setTimeout(()=>{ placed=[]; document.querySelectorAll('.card').forEach(c=>c.classList.remove('gone')); sync(); }, 900);
  }
};
$('next').onclick = ()=>{ r = (r+1) % ROUNDS.length; build(); window.scrollTo({top:0,behavior:'smooth'}); };
$('speak').onclick = ()=>speak($('say').textContent);
build();
</script>
</body>
</html>
