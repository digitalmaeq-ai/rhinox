<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 2 · Week 6</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found them all! Which one is NOT an animal?</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Yes! A ball is not an animal!</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"pepper": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M60 70 Q100 50 140 70 Q160 110 140 150 Q120 176 100 160 Q80 176 60 150 Q40 110 60 70Z\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M100 60 L100 34 L114 30\" stroke=\"#2a7a46\" stroke-width=\"8\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "star_outline": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><polygon points=\"100.0,28.0 78.8,78.9 23.9,83.3 65.8,119.1 53.0,172.7 100.0,144.0 147.0,172.7 134.2,119.1 176.1,83.3 121.2,78.9\" fill=\"#FFFFFF\" stroke=\"#16324F\" stroke-width=\"7\" stroke-linejoin=\"round\"/></svg>", "circle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "shoes": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M32 52 L66 52 L72 78 Q106 84 108 104 L108 112 L28 112 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"26\" y=\"108\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M40 66 L62 62 M40 76 L64 72\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M96 100 L130 100 L136 126 Q170 132 172 152 L172 160 L92 160 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"90\" y=\"156\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M104 114 L126 110 M104 124 L128 120\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"78\" cy=\"78\" r=\"14\" fill=\"#ffffff\" opacity=\".35\"/></svg>", "tomato": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"110\" r=\"60\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M100 54 L84 40 M100 54 L116 40 M100 54 L100 34 M100 54 L80 58 M100 54 L120 58\" stroke=\"#3BB273\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"96\" r=\"10\" fill=\"#fff\" opacity=\".35\"/></svg>", "orange": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"108\" r=\"60\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M100 48 Q120 28 140 40 Q120 58 100 48Z\" fill=\"#3BB273\"/><circle cx=\"80\" cy=\"100\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"110\" cy=\"90\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"120\" cy=\"124\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"90\" cy=\"130\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"100\" cy=\"110\" r=\"2.5\" fill=\"#c46f0f\"/></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>", "yellow": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"78\" cy=\"78\" r=\"14\" fill=\"#ffffff\" opacity=\".35\"/></svg>", "ci_red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "ball": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"100\" r=\"62\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M40 92 Q100 120 160 92 M60 52 Q100 80 140 52 M60 148 Q100 120 140 148\" stroke=\"#E5484D\" stroke-width=\"7\" fill=\"none\"/></svg>", "bird": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><ellipse cx=\"96\" cy=\"112\" rx=\"56\" ry=\"44\" fill=\"#168fe5\"/><circle cx=\"138\" cy=\"78\" r=\"28\" fill=\"#168fe5\"/><circle cx=\"146\" cy=\"72\" r=\"6\" fill=\"#fff\"/><circle cx=\"148\" cy=\"72\" r=\"3\" fill=\"#16324F\"/><path d=\"M164 80 L186 86 L164 92Z\" fill=\"#F7931E\"/><path d=\"M70 100 Q90 70 116 104Z\" fill=\"#0f6db0\"/><path d=\"M42 106 L18 92 L26 120Z\" fill=\"#0f6db0\"/><path d=\"M90 154 L86 172 M108 154 L112 172\" stroke=\"#F7931E\" stroke-width=\"5\"/></svg>", "square": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "ci_blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "cat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><circle cx=\"100\" cy=\"104\" r=\"52\" fill=\"#9aa9b8\"/><path d=\"M58 76 L62 36 L90 60Z M142 76 L138 36 L110 60Z\" fill=\"#9aa9b8\"/><circle cx=\"82\" cy=\"98\" r=\"7\" fill=\"#16324F\"/><circle cx=\"118\" cy=\"98\" r=\"7\" fill=\"#16324F\"/><path d=\"M94 114 L106 114 L100 122Z\" fill=\"#E5484D\"/><path d=\"M60 114 L30 108 M60 122 L32 126 M140 114 L170 108 M140 122 L168 126\" stroke=\"#16324F\" stroke-width=\"3\"/></svg>", "sq_red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "dog": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"104\" r=\"52\" fill=\"#C68642\"/><ellipse cx=\"54\" cy=\"96\" rx=\"18\" ry=\"34\" fill=\"#8a5a2b\"/><ellipse cx=\"146\" cy=\"96\" rx=\"18\" ry=\"34\" fill=\"#8a5a2b\"/><circle cx=\"84\" cy=\"96\" r=\"7\" fill=\"#16324F\"/><circle cx=\"116\" cy=\"96\" r=\"7\" fill=\"#16324F\"/><ellipse cx=\"100\" cy=\"120\" rx=\"14\" ry=\"10\" fill=\"#16324F\"/><path d=\"M100 130 Q100 146 112 146\" stroke=\"#E5484D\" stroke-width=\"6\" fill=\"none\"/></svg>", "cup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M50 60 L150 60 L136 166 L64 166 Z\" fill=\"#cfe9fb\" stroke=\"#16324F\" stroke-width=\"6\" stroke-linejoin=\"round\"/><rect x=\"42\" y=\"50\" width=\"116\" height=\"16\" rx=\"6\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"5\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"48\" fill=\"#F7931E\">?</text></svg>", "sq_blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "hoop": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><ellipse cx=\"100\" cy=\"110\" rx=\"74\" ry=\"40\" fill=\"none\" stroke=\"#F7931E\" stroke-width=\"12\"/></svg>", "red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"78\" cy=\"78\" r=\"14\" fill=\"#ffffff\" opacity=\".35\"/></svg>"};
const CFG = {"names": {"tomato": "tomato", "pepper": "pepper", "orange": "orange", "cat": "cat"}, "answer": "ball", "choices": ["cat", "dog", "ball"], "ask": "You found them all! Which one is NOT an animal?", "yes": "Yes! A ball is not an animal!", "no": "That one is an animal. Find the one that is not."}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
