<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorting Robot</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--bg:#F4F9FF;--card:#fff;--ink:#16324F}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--blue);color:var(--navy);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0 8px;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #d8e8f8}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);color:var(--navy);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.round{font-weight:800;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);margin:18px 0}
.slot{aspect-ratio:1/1.1;border:4px dashed #9cc9f0;border-radius:24px;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .num{position:absolute;top:8px;left:12px;font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--blue)}
.slot .lbl{position:absolute;bottom:6px;width:100%;text-align:center;font-weight:800;font-size:clamp(13px,2.6vw,18px);color:#5b7a98}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot svg,.card svg{width:78%;height:auto}
.arrows{display:flex;justify-content:space-around;margin-top:-10px;color:var(--blue);font-size:28px;font-weight:900}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);min-height:120px;margin-top:6px}
.card{border:0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 0 #c9dcef;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #c9dcef}
.card.gone{visibility:hidden}
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:6px auto 0;opacity:.95}
.model div{background:#fff;border-radius:16px;padding:4px;border:3px solid var(--orange);position:relative}
.model div b{position:absolute;top:2px;left:8px;color:var(--orange);font-weight:900}
.model svg{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c9dcef}
.btn[disabled]{opacity:.45;cursor:default}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{display:none;text-align:center;padding:10px}
.win.show{display:block}
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.note{font-size:12px;color:#5b7a98;text-align:center;margin-top:18px}

.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0;min-height:90px}
.pool .card{width:min(19vw,104px)}
.pool .card.sel{outline:5px solid var(--orange);transform:translateY(-4px)}
.bins{display:grid;gap:10px;margin-top:10px}
.bin{border:4px dashed #9cc9f0;border-radius:24px;background:#fff;min-height:150px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.bin .lab{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;color:var(--navy)}
.bin .lab svg{width:44px;height:44px}
.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.bin .in svg{width:46px;height:46px}
.bin.hint{border-color:var(--orange);background:#FFF4D6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Think • Move • Code! · Nursery 1 · Term 2 · Week 6</div><div class="tag">Optional · just for fun · not a test</div></div>
  <div class="bubble"><div class="bot">Rhino<br>Bot</div><div><div class="round" id="round"></div><p class="say" id="say"></p></div><button class="speak" id="speak" aria-label="Read aloud">🔊</button></div>
  <p style="text-align:center;font-weight:800;color:#5b7a98;margin:4px 0">Tap a picture, then tap its group.</p>
  <div class="pool" id="pool"></div>
  <div class="bins" id="bins"></div>
  <div class="win" id="win"><div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div><p class="say" id="winsay"></p><div class="bar"><button class="btn" id="next">Next ▶</button></div></div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"pepper": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M60 70 Q100 50 140 70 Q160 110 140 150 Q120 176 100 160 Q80 176 60 150 Q40 110 60 70Z\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M100 60 L100 34 L114 30\" stroke=\"#2a7a46\" stroke-width=\"8\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "star_outline": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><polygon points=\"100.0,28.0 78.8,78.9 23.9,83.3 65.8,119.1 53.0,172.7 100.0,144.0 147.0,172.7 134.2,119.1 176.1,83.3 121.2,78.9\" fill=\"#FFFFFF\" stroke=\"#16324F\" stroke-width=\"7\" stroke-linejoin=\"round\"/></svg>", "circle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "shoes": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M32 52 L66 52 L72 78 Q106 84 108 104 L108 112 L28 112 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"26\" y=\"108\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M40 66 L62 62 M40 76 L64 72\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M96 100 L130 100 L136 126 Q170 132 172 152 L172 160 L92 160 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"90\" y=\"156\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M104 114 L126 110 M104 124 L128 120\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"78\" cy=\"78\" r=\"14\" fill=\"#ffffff\" opacity=\".35\"/></svg>", "tomato": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"110\" r=\"60\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M100 54 L84 40 M100 54 L116 40 M100 54 L100 34 M100 54 L80 58 M100 54 L120 58\" stroke=\"#3BB273\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"96\" r=\"10\" fill=\"#fff\" opacity=\".35\"/></svg>", "orange": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"108\" r=\"60\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M100 48 Q120 28 140 40 Q120 58 100 48Z\" fill=\"#3BB273\"/><circle cx=\"80\" cy=\"100\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"110\" cy=\"90\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"120\" cy=\"124\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"90\" cy=\"130\" r=\"2.5\" fill=\"#c46f0f\"/><circle cx=\"100\" cy=\"110\" r=\"2.5\" fill=\"#c46f0f\"/></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>", "yellow": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"78\" cy=\"78\" r=\"14\" fill=\"#ffffff\" opacity=\".35\"/></svg>", "ci_red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "ball": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"100\" r=\"62\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M40 92 Q100 120 160 92 M60 52 Q100 80 140 52 M60 148 Q100 120 140 148\" stroke=\"#E5484D\" stroke-width=\"7\" fill=\"none\"/></svg>", "bird": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><ellipse cx=\"96\" cy=\"112\" rx=\"56\" ry=\"44\" fill=\"#168fe5\"/><circle cx=\"138\" cy=\"78\" r=\"28\" fill=\"#168fe5\"/><circle cx=\"146\" cy=\"72\" r=\"6\" fill=\"#fff\"/><circle cx=\"148\" cy=\"72\" r=\"3\" fill=\"#16324F\"/><path d=\"M164 80 L186 86 L164 92Z\" fill=\"#F7931E\"/><path d=\"M70 100 Q90 70 116 104Z\" fill=\"#0f6db0\"/><path d=\"M42 106 L18 92 L26 120Z\" fill=\"#0f6db0\"/><path d=\"M90 154 L86 172 M108 154 L112 172\" stroke=\"#F7931E\" stroke-width=\"5\"/></svg>", "square": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "ci_blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "cat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><circle cx=\"100\" cy=\"104\" r=\"52\" fill=\"#9aa9b8\"/><path d=\"M58 76 L62 36 L90 60Z M142 76 L138 36 L110 60Z\" fill=\"#9aa9b8\"/><circle cx=\"82\" cy=\"98\" r=\"7\" fill=\"#16324F\"/><circle cx=\"118\" cy=\"98\" r=\"7\" fill=\"#16324F\"/><path d=\"M94 114 L106 114 L100 122Z\" fill=\"#E5484D\"/><path d=\"M60 114 L30 108 M60 122 L32 126 M140 114 L170 108 M140 122 L168 126\" stroke=\"#16324F\" stroke-width=\"3\"/></svg>", "sq_red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "dog": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"104\" r=\"52\" fill=\"#C68642\"/><ellipse cx=\"54\" cy=\"96\" rx=\"18\" ry=\"34\" fill=\"#8a5a2b\"/><ellipse cx=\"146\" cy=\"96\" rx=\"18\" ry=\"34\" fill=\"#8a5a2b\"/><circle cx=\"84\" cy=\"96\" r=\"7\" fill=\"#16324F\"/><circle cx=\"116\" cy=\"96\" r=\"7\" fill=\"#16324F\"/><ellipse cx=\"100\" cy=\"120\" rx=\"14\" ry=\"10\" fill=\"#16324F\"/><path d=\"M100 130 Q100 146 112 146\" stroke=\"#E5484D\" stroke-width=\"6\" fill=\"none\"/></svg>", "cup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M50 60 L150 60 L136 166 L64 166 Z\" fill=\"#cfe9fb\" stroke=\"#16324F\" stroke-width=\"6\" stroke-linejoin=\"round\"/><rect x=\"42\" y=\"50\" width=\"116\" height=\"16\" rx=\"6\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"5\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"48\" fill=\"#F7931E\">?</text></svg>", "sq_blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "hoop": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><ellipse cx=\"100\" cy=\"110\" rx=\"74\" ry=\"40\" fill=\"none\" stroke=\"#F7931E\" stroke-width=\"12\"/></svg>", "red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"78\" cy=\"78\" r=\"14\" fill=\"#ffffff\" opacity=\".35\"/></svg>"};
const ROUNDS = [{"say": "Sort by colour! Red things here, blue things there.", "bins": [{"name": "red", "icon": "red"}, {"name": "blue", "icon": "blue"}], "items": [["ci_red", 0, "red circle"], ["sq_red", 0, "red square"], ["tomato", 0, "tomato"], ["ci_blue", 1, "blue circle"], ["sq_blue", 1, "blue square"], ["bird", 1, "blue bird"]], "oops": "Our rule is colour. Is it red or blue?", "win": "All sorted by colour! Your rule was colour."}, {"say": "Same kind of things, new rule: sort by shape!", "bins": [{"name": "circles", "icon": "circle"}, {"name": "squares", "icon": "square"}], "items": [["ci_red", 0, "red circle"], ["ci_blue", 0, "blue circle"], ["ball", 0, "ball"], ["sq_red", 1, "red square"], ["sq_blue", 1, "blue square"]], "oops": "Our rule is shape now. Is it a circle or a square?", "win": "Sorted by shape! A new rule made new groups."}, {"say": "Animal or not animal?", "bins": [{"name": "animals", "icon": "cat"}, {"name": "not animals", "icon": "ball"}], "items": [["cat", 0, "cat"], ["dog", 0, "dog"], ["bird", 0, "bird"], ["ball", 1, "ball"], ["cup", 1, "cup"], ["shoes", 1, "shoes"]], "oops": "Is it an animal? Think again.", "win": "Animals and not animals! Great sorting!"}, {"say": "Stretch! Two rules: colour and shape.", "stretch": true, "bins": [{"name": "red circles", "icon": "ci_red"}, {"name": "blue circles", "icon": "ci_blue"}, {"name": "red squares", "icon": "sq_red"}, {"name": "blue squares", "icon": "sq_blue"}], "items": [["ci_red", 0, "red circle"], ["ci_blue", 1, "blue circle"], ["sq_red", 2, "red square"], ["sq_blue", 3, "blue square"], ["tomato", 0, "tomato, a red circle"]], "oops": "Check the colour AND the shape.", "win": "Two rules at once! Amazing!"}];
let r=0, sel=null, left=0;
const $=id=>document.getElementById(id);
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function build(){
  const R=ROUNDS[r]; sel=null; left=R.items.length;
  $('round').textContent=`Round ${r+1} of ${ROUNDS.length}`+(R.stretch?' · Stretch':'');
  $('say').textContent=R.say; $('win').classList.remove('show');
  $('pool').innerHTML=shuffle(R.items).map((it,i)=>`<button class="card" data-k="${it[0]}" data-b="${it[1]}" aria-label="${it[2]||it[0]}">${ICONS[it[0]]}</button>`).join('');
  $('bins').style.gridTemplateColumns=`repeat(${Math.min(R.bins.length,2)},1fr)`;
  $('bins').innerHTML=R.bins.map((b,i)=>`<div class="bin" data-b="${i}"><div class="lab">${b.icon?ICONS[b.icon]:''}${b.name}</div><div class="in"></div></div>`).join('');
  document.querySelectorAll('.pool .card').forEach(c=>c.onclick=()=>{ document.querySelectorAll('.pool .card').forEach(x=>x.classList.remove('sel')); sel=c; c.classList.add('sel'); speak(c.getAttribute('aria-label')); });
  document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>drop(b));
  speak(R.say);
}
function drop(b){
  const R=ROUNDS[r]; if(!sel){ const t='First tap a picture.'; $('say').textContent=t; speak(t); return; }
  if(sel.dataset.b===b.dataset.b){
    b.querySelector('.in').insertAdjacentHTML('beforeend',ICONS[sel.dataset.k]); sel.remove(); sel=null; left--;
    if(left===0){ $('say').textContent='You did it!'; $('winsay').textContent=R.win; $('win').classList.add('show'); speak('You did it! '+R.win); $('next').textContent=r<ROUNDS.length-1?'Next ▶':'Play again ↻'; }
  } else {
    const t=R.oops||'Not that group. Think about the rule!'; $('say').textContent=t; speak(t);
    b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),500);
  }
}
$('next').onclick=()=>{ r=(r+1)%ROUNDS.length; build(); window.scrollTo({top:0,behavior:'smooth'}); };
$('speak').onclick=()=>speak($('say').textContent);
build();
</script>
</body>
</html>
