<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 3 · Week 6</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found them all! If the light is red, then…?</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Stop! You followed the rule!</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"batteries": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><g transform=\"translate(54,56)\"><rect x=\"0\" y=\"6\" width=\"34\" height=\"78\" rx=\"6\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"10\" y=\"0\" width=\"14\" height=\"8\" rx=\"2\" fill=\"#9aa9b8\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"0\" y=\"54\" width=\"34\" height=\"30\" rx=\"6\" fill=\"#16324F\"/><text x=\"17\" y=\"44\" font-family=\"Arial\" font-weight=\"900\" font-size=\"14\" text-anchor=\"middle\" fill=\"#fff\">AA</text></g><g transform=\"translate(110,56)\"><rect x=\"0\" y=\"6\" width=\"34\" height=\"78\" rx=\"6\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"10\" y=\"0\" width=\"14\" height=\"8\" rx=\"2\" fill=\"#9aa9b8\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"0\" y=\"54\" width=\"34\" height=\"30\" rx=\"6\" fill=\"#16324F\"/><text x=\"17\" y=\"44\" font-family=\"Arial\" font-weight=\"900\" font-size=\"14\" text-anchor=\"middle\" fill=\"#fff\">AA</text></g></svg>", "walk": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"96\" cy=\"48\" r=\"20\" fill=\"#8D5524\"/><path d=\"M78 42 Q96 14 114 42 Q96 30 78 42Z\" fill=\"#1d1d1d\"/><circle cx=\"87\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"105\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M87 60 Q96 68 105 60\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"80\" y=\"68\" width=\"32\" height=\"44\" rx=\"12\" fill=\"#F7931E\"/><path d=\"M86 108 L70 150\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M104 108 L122 148\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M82 76 L62 100\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M110 7 0\" x2=\"168\" y2=\"100\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"100\" x2=\"32\" y2=\"100\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"100\" y1=\"150\" x2=\"100\" y2=\"168\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"100\" y1=\"50\" x2=\"100\" y2=\"32\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"135\" y1=\"135\" x2=\"148\" y2=\"148\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"65\" y1=\"135\" x2=\"52\" y2=\"148\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"135\" y1=\"65\" x2=\"148\" y2=\"52\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/><line x1=\"65\" y1=\"65\" x2=\"52\" y2=\"52\" stroke=\"#F7931E\" stroke-width=\"8\" stroke-linecap=\"round\"/></svg>", "btn_green": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><ellipse cx=\"100\" cy=\"128\" rx=\"62\" ry=\"22\" fill=\"#9aa9b8\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M52 100 Q52 78 100 78 Q148 78 148 100 L148 118 Q148 136 100 136 Q52 136 52 118Z\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><ellipse cx=\"100\" cy=\"98\" rx=\"48\" ry=\"18\" fill=\"#7fd99f\"/></svg>", "dark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#22314a\"/><path d=\"M126 50 A50 50 0 1 0 150 140 A40 40 0 1 1 126 50Z\" fill=\"#FFC93C\"/><circle cx=\"56\" cy=\"56\" r=\"4\" fill=\"#fff\"/><circle cx=\"76\" cy=\"136\" r=\"3\" fill=\"#fff\"/><circle cx=\"160\" cy=\"46\" r=\"3\" fill=\"#fff\"/></svg>", "sunhat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><ellipse cx=\"100\" cy=\"118\" rx=\"76\" ry=\"22\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M58 116 Q60 64 100 62 Q140 64 142 116Z\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M60 104 L140 104\" stroke=\"#E5484D\" stroke-width=\"9\"/></svg>", "jump": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"100\" cy=\"50\" r=\"20\" fill=\"#8D5524\"/><path d=\"M82 44 Q100 16 118 44 Q100 32 82 44Z\" fill=\"#1d1d1d\"/><circle cx=\"91\" cy=\"52\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"109\" cy=\"52\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M91 62 Q100 70 109 62\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"84\" y=\"70\" width=\"32\" height=\"40\" rx=\"12\" fill=\"#F7931E\"/><path d=\"M90 108 L80 134\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M110 108 L120 134\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M86 78 L62 52\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M114 78 L138 52\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><rect x=\"30\" y=\"170\" width=\"140\" height=\"8\" rx=\"4\" fill=\"#3BB273\"/><path d=\"M70 150 L70 162 M100 146 L100 162 M130 150 L130 162\" stroke=\"#3BB273\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "tl_green": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><rect x=\"72\" y=\"26\" width=\"56\" height=\"130\" rx=\"14\" fill=\"#16324F\"/><rect x=\"94\" y=\"156\" width=\"12\" height=\"30\" fill=\"#16324F\"/><circle cx=\"100\" cy=\"56\" r=\"17\" fill=\"#4a3030\"/><circle cx=\"100\" cy=\"92\" r=\"17\" fill=\"#4a4a30\"/><circle cx=\"100\" cy=\"128\" r=\"17\" fill=\"#3BB273\"/></svg>", "ifcard": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><text x=\"100\" y=\"128\" font-family=\"Arial\" font-weight=\"900\" font-size=\"72\" text-anchor=\"middle\" fill=\"#8E5BD9\">IF</text></svg>", "thencard": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><text x=\"100\" y=\"122\" font-family=\"Arial\" font-weight=\"900\" font-size=\"50\" text-anchor=\"middle\" fill=\"#3BB273\">THEN</text></svg>", "star_outline": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><polygon points=\"100.0,28.0 78.8,78.9 23.9,83.3 65.8,119.1 53.0,172.7 100.0,144.0 147.0,172.7 134.2,119.1 176.1,83.3 121.2,78.9\" fill=\"#FFFFFF\" stroke=\"#16324F\" stroke-width=\"7\" stroke-linejoin=\"round\"/></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>", "btn_red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><ellipse cx=\"100\" cy=\"128\" rx=\"62\" ry=\"22\" fill=\"#9aa9b8\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M52 100 Q52 78 100 78 Q148 78 148 100 L148 118 Q148 136 100 136 Q52 136 52 118Z\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"4\"/><ellipse cx=\"100\" cy=\"98\" rx=\"48\" ry=\"18\" fill=\"#ff7a7e\"/></svg>", "clap": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><g transform=\"rotate(-18 92 104)\"><rect x=\"66\" y=\"56\" width=\"40\" height=\"80\" rx=\"20\" fill=\"#8D5524\"/></g><g transform=\"rotate(18 108 104)\"><rect x=\"96\" y=\"56\" width=\"40\" height=\"80\" rx=\"20\" fill=\"#6B3F1A\"/></g><path d=\"M60 40 L48 26\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M100 30 L100 12\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M140 40 L152 26\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M44 80 L28 76\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M156 80 L172 76\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><rect x=\"70\" y=\"140\" width=\"60\" height=\"30\" rx=\"12\" fill=\"#F7931E\"/></svg>", "torch_off": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#22314a\"/><rect x=\"40\" y=\"86\" width=\"80\" height=\"34\" rx=\"8\" fill=\"#5b6b7a\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M120 80 L146 72 L146 134 L120 126Z\" fill=\"#9aa9b8\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"70\" y=\"80\" width=\"16\" height=\"8\" rx=\"2\" fill=\"#E5484D\"/><text x=\"80\" y=\"160\" font-family=\"Arial\" font-weight=\"900\" font-size=\"30\" text-anchor=\"middle\" fill=\"#9aa9b8\">?</text></svg>", "rain": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M50 96 Q46 66 76 64 Q86 40 112 48 Q140 40 146 68 Q172 70 166 96Z\" fill=\"#c9d6e2\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M70 112 L62 132\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M80 142 L72 162\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M92 112 L84 132\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M102 142 L94 162\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M114 112 L106 132\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M124 142 L116 162\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M136 112 L128 132\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M146 142 L138 162\" stroke=\"#168fe5\" stroke-width=\"7\" stroke-linecap=\"round\"/></svg>"};
const CFG = {"names": {"rain": "rain", "tl_red": "red light", "dark": "dark", "btn_green": "green button"}, "answer": "stop", "choices": ["walk", "stop", "umbrella"], "ask": "You found them all! If the light is red, then\u2026?", "yes": "Stop! You followed the rule!", "no": "Red means\u2026 stop! Try again."}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
