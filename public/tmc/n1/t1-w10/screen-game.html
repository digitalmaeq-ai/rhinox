<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Review</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--bg:#F4F9FF;--card:#fff;--ink:#16324F}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--blue);color:var(--navy);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0 8px;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #d8e8f8}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);color:var(--navy);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.round{font-weight:800;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);margin:18px 0}
.slot{aspect-ratio:1/1.1;border:4px dashed #9cc9f0;border-radius:24px;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .num{position:absolute;top:8px;left:12px;font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--blue)}
.slot .lbl{position:absolute;bottom:6px;width:100%;text-align:center;font-weight:800;font-size:clamp(13px,2.6vw,18px);color:#5b7a98}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot svg,.card svg{width:78%;height:auto}
.arrows{display:flex;justify-content:space-around;margin-top:-10px;color:var(--blue);font-size:28px;font-weight:900}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);min-height:120px;margin-top:6px}
.card{border:0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 0 #c9dcef;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #c9dcef}
.card.gone{visibility:hidden}
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:6px auto 0;opacity:.95}
.model div{background:#fff;border-radius:16px;padding:4px;border:3px solid var(--orange);position:relative}
.model div b{position:absolute;top:2px;left:8px;color:var(--orange);font-weight:900}
.model svg{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c9dcef}
.btn[disabled]{opacity:.45;cursor:default}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{display:none;text-align:center;padding:10px}
.win.show{display:block}
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.note{font-size:12px;color:#5b7a98;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Week 10</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>

  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <div><div class="round" id="round">Round 1 of 2</div><p class="say" id="say">From memory! Tap Ayo’s morning in order.</p></div>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div id="model" class="model" hidden></div>

  <div class="slots" id="slots"></div>
  
  <div class="tray" id="tray"></div>

  <div class="bar">
    <button class="btn alt" id="undo">↩ Undo</button>
    <button class="btn" id="check" disabled>✔ Check</button>
  </div>

  <div class="win" id="win">
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p class="say" id="winsay"></p>
    <div class="bar"><button class="btn" id="next">Next ▶</button></div>
  </div>

  <p class="note">Works offline once loaded.</p>
</div>

16324F\"/><rect x=\"26\" y=\"30\" width=\"18\" height=\"128\" rx=\"3\" fill=\"#16324F\"/><rect x=\"156\" y=\"30\" width=\"18\" height=\"128\" rx=\"3\" fill=\"#16324F\"/><rect x=\"52\" y=\"60\" width=\"7\" height=\"92\" rx=\"3\" fill=\"#3BB273\"/><rect x=\"66\" y=\"60\" width=\"7\" height=\"92\" rx=\"3\" fill=\"#3BB273\"/><rect x=\"80\" y=\"60\" width=\"7\" height=\"92\" rx=\"3\" fill=\"#3BB273\"/><rect x=\"94\" y=\"60\" width=\"7\" height=\"92\" rx=\"3\" fill=\"#3BB273\"/><rect x=\"108\" y=\"60\" width=\"7\" height=\"92\" rx=\"3\" fill=\"#3BB273\"/><rect x=\"122\" y=\"60\" width=\"7\" height=\"92\" rx=\"3\" fill=\"#3BB273\"/><rect x=\"136\" y=\"60\" width=\"7\" height=\"92\" rx=\"3\" fill=\"#3BB273\"/><rect x=\"44\" y=\"70\" width=\"112\" height=\"7\" fill=\"#3BB273\"/><rect x=\"44\" y=\"136\" width=\"112\" height=\"7\" fill=\"#3BB273\"/><rect x=\"56\" y=\"20\" width=\"88\" height=\"30\" rx=\"6\" fill=\"#F7931E\"/><text x=\"100\" y=\"42\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"18\" fill=\"#fff\">SCHOOL</text></svg>"};
const ROUNDS = [{"say": "From memory! Tap Ayo\u2019s morning in order.", "order": ["wake", "brush", "eat"], "labels": {"wake": "wake up", "brush": "brush teeth", "eat": "eat breakfast"}, "oops": "Think: what does Ayo do first?", "win": "Wake up, brush teeth, eat breakfast. You remembered!"}, {"say": "First, next, last at the door!", "order": ["standup", "walk", "wave"], "labels": {"standup": "stand up", "walk": "walk", "wave": "wave goodbye"}, "oops": "Try again: what comes first at the door?", "win": "Stand up, walk, wave. Bye-bye!"}, {"say": "Make Ayo clap 3 times.", "order": ["clap", "again", "again"], "extra": ["stop"], "labels": {"clap": "clap", "again": "do it again", "stop": "stop"}, "oops": "Remember: clap, do it again, do it again.", "win": "Clap, clap, clap! Three times!"}, {"say": "Stretch! Four cards: get ready for school.", "stretch": true, "order": ["wake", "socks", "shoes", "school"], "labels": {"wake": "wake up", "socks": "socks", "shoes": "shoes", "school": "walk to school"}, "oops": "Socks before shoes! Try again.", "win": "Wake up, socks, shoes, walk to school!"}];
const WORDS = n => n===3 ? ["first","next","last"] : ["first", ...Array(n-2).fill("next"), "last"];
let r = 0, placed = [];
const $ = id => document.getElementById(id);

function speak(t){
  try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.rate = .85; u.pitch = 1.1; speechSynthesis.speak(u);}catch(e){}
}
function shuffle(a){ a = a.slice(); do{ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }while(a.join()===ROUNDS[r].order.join()); return a; }

function build(){
  const R = ROUNDS[r]; placed = [];
  $('round').textContent = `Round ${r+1} of ${ROUNDS.length}` + (R.stretch ? ' · Stretch' : '');
  $('say').textContent = R.say;
  $('win').classList.remove('show');
  const m = $('model'); m.hidden = !R.model; m.innerHTML = R.model ? R.order.map((k,i)=>`<div><b>${i+1}</b>${ICONS[k]}</div>`).join('') : '';
  $('slots').style.gridTemplateColumns = `repeat(${R.order.length},1fr)`; $('tray').style.gridTemplateColumns = `repeat(${R.order.length+(R.extra||[]).length},1fr)`;
  $('slots').innerHTML = WORDS(R.order.length).map((w,i)=>`<div class="slot" data-i="${i}"><span class="num">${i+1}</span><span class="lbl">${w}</span></div>`).join('');
  $('tray').innerHTML = shuffle(R.order.concat(R.extra||[])).map(k=>`<button class="card" data-k="${k}" aria-label="${R.labels[k]}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>place(c));
  sync(); speak(R.say);
}
function place(c){
  if(placed.length>=ROUNDS[r].order.length) return;
  placed.push(c.dataset.k); c.classList.add('gone'); speak(ROUNDS[r].labels[c.dataset.k]); sync();
}
function sync(){
  const R = ROUNDS[r];
  document.querySelectorAll('.slot').forEach((s,i)=>{
    const k = placed[i];
    s.classList.toggle('filled', !!k);
    s.querySelectorAll('svg').forEach(x=>x.remove());
    if(k) s.insertAdjacentHTML('beforeend', ICONS[k]);
  });
  $('check').disabled = placed.length<R.order.length;
}
$('undo').onclick = ()=>{ const k = placed.pop(); if(!k) return; const c=document.querySelector(`.card.gone[data-k="${k}"]`); c.classList.remove('gone'); sync(); };
$('check').onclick = ()=>{
  const R = ROUNDS[r];
  if(placed.join()===R.order.join()){
    $('winsay').textContent = R.win; $('win').classList.add('show'); speak("Well done! "+R.win);
    $('next').textContent = r < ROUNDS.length-1 ? 'Next ▶' : 'Play again ↻';
    $('win').scrollIntoView({behavior:'smooth',block:'center'});
  } else {
    $('slots').classList.add('shake'); setTimeout(()=>$('slots').classList.remove('shake'),500);
    const t = R.oops || (R.model ? "Oops! Look at RhinoBot's cards and try again." : "Oops! What does Ayo do first? Try again.");
    $('say').textContent = t; speak(t);
    setTimeout(()=>{ placed=[]; document.querySelectorAll('.card').forEach(c=>c.classList.remove('gone')); sync(); }, 900);
  }
};
$('next').onclick = ()=>{ r = (r+1) % ROUNDS.length; build(); window.scrollTo({top:0,behavior:'smooth'}); };
$('speak').onclick = ()=>speak($('say').textContent);
build();
</script>
