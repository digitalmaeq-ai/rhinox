<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayo's Pattern Road</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--bg:#F4F9FF;--card:#fff;--ink:#16324F}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--blue);color:var(--navy);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0 8px;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #d8e8f8}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);color:var(--navy);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.round{font-weight:800;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);margin:18px 0}
.slot{aspect-ratio:1/1.1;border:4px dashed #9cc9f0;border-radius:24px;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .num{position:absolute;top:8px;left:12px;font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--blue)}
.slot .lbl{position:absolute;bottom:6px;width:100%;text-align:center;font-weight:800;font-size:clamp(13px,2.6vw,18px);color:#5b7a98}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot svg,.card svg{width:78%;height:auto}
.arrows{display:flex;justify-content:space-around;margin-top:-10px;color:var(--blue);font-size:28px;font-weight:900}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);min-height:120px;margin-top:6px}
.card{border:0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 0 #c9dcef;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #c9dcef}
.card.gone{visibility:hidden}
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:6px auto 0;opacity:.95}
.model div{background:#fff;border-radius:16px;padding:4px;border:3px solid var(--orange);position:relative}
.model div b{position:absolute;top:2px;left:8px;color:var(--orange);font-weight:900}
.model svg{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c9dcef}
.btn[disabled]{opacity:.45;cursor:default}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{display:none;text-align:center;padding:10px}
.win.show{display:block}
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.note{font-size:12px;color:#5b7a98;text-align:center;margin-top:18px}

.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.seq .it{width:min(15vw,96px);aspect-ratio:1;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #d8e8f8}
.seq .it svg{width:92%;height:auto}
.seq .it.blank{outline:4px dashed var(--orange);background:#FFF4D6}
.seq .it.now{outline:5px solid var(--orange)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 2 · Week 4</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <div><div class="round" id="round"></div><p class="say" id="say"></p></div>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>
  <div class="seq" id="seq"></div>
  <p style="text-align:center;font-weight:800;color:#5b7a98;margin:4px 0">What comes next? Tap a card.</p>
  <div class="tray" id="tray"></div>
  <div class="bar"><button class="btn alt" id="listen" hidden>👂 Listen</button><button class="btn alt" id="undo">↩ Undo</button></div>
  <div class="win" id="win">
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p class="say" id="winsay"></p>
    <div class="bar"><button class="btn" id="next">Next ▶</button></div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"hop": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"46\" r=\"19\" fill=\"#8D5524\"/><path d=\"M83 40 Q100 13 117 40 Q100 29 83 40Z\" fill=\"#1d1d1d\"/><circle cx=\"91\" cy=\"48\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"109\" cy=\"48\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M91 58 Q100 66 109 58\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"84\" y=\"65\" width=\"32\" height=\"40\" rx=\"12\" fill=\"#F7931E\"/><path d=\"M94 104 L92 150\" stroke=\"#16324F\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M106 104 L122 122 L114 132\" stroke=\"#16324F\" stroke-width=\"10\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M86 74 L66 92\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M114 74 L134 92\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><circle cx=\"60\" cy=\"172\" r=\"12\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"88\" y=\"160\" width=\"24\" height=\"24\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"140\" cy=\"172\" r=\"12\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"3\"/></svg>", "ayotoken": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><circle cx=\"100\" cy=\"100\" r=\"92\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"8\"/><circle cx=\"100\" cy=\"96\" r=\"48\" fill=\"#8D5524\"/><path d=\"M54 90 Q100 34 146 90 Q100 50 54 90Z\" fill=\"#1d1d1d\"/><circle cx=\"91\" cy=\"98\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"109\" cy=\"98\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M91 108 Q100 116 109 108\" stroke=\"#1d1d1d\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "sq_blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "square": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "ci_blue": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "triangle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><polygon points=\"100,30 172,164 28,164\" fill=\"#8E5BD9\" stroke=\"#16324F\" stroke-width=\"6\" stroke-linejoin=\"round\"/></svg>", "sq_red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><rect x=\"36\" y=\"36\" width=\"128\" height=\"128\" rx=\"8\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "fixed": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"#3BB273\"/><path d=\"M66 102 L90 126 L138 76\" stroke=\"#fff\" stroke-width=\"16\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "circle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "ci_red": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#ffffff\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"6\"/></svg>", "empty": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F7F9FC\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#9aa9b8\" stroke-width=\"5\" stroke-dasharray=\"10 8\"/></svg>", "shapebot": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><circle cx=\"100\" cy=\"56\" r=\"30\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"90\" cy=\"54\" r=\"4\" fill=\"#16324F\"/><circle cx=\"110\" cy=\"54\" r=\"4\" fill=\"#16324F\"/><rect x=\"64\" y=\"90\" width=\"72\" height=\"66\" rx=\"6\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"5\"/><rect x=\"72\" y=\"158\" width=\"18\" height=\"24\" fill=\"#16324F\"/><rect x=\"110\" y=\"158\" width=\"18\" height=\"24\" fill=\"#16324F\"/><rect x=\"38\" y=\"98\" width=\"24\" height=\"12\" rx=\"5\" fill=\"#168fe5\"/><rect x=\"138\" y=\"98\" width=\"24\" height=\"12\" rx=\"5\" fill=\"#168fe5\"/><path d=\"M150 40 L176 40 M150 56 L176 56\" stroke=\"#F7931E\" stroke-width=\"0\"/></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>"};
const ROUNDS = [{"say": "Ayo\u2019s road!", "seq": ["circle", "square", "circle", "square"], "answer": ["circle", "square"], "choices": ["circle", "square", "triangle"], "labels": {"circle": "circle", "square": "square", "triangle": "triangle"}, "oops": "Say it: circle, square, circle, square\u2026", "win": "Circle, square, circle, square! Ayo\u2019s road is ready!"}, {"say": "A triangle road!", "seq": ["triangle", "circle", "triangle", "circle"], "answer": ["triangle", "circle"], "choices": ["triangle", "circle", "square"], "labels": {"triangle": "triangle", "circle": "circle", "square": "square"}, "oops": "Say it: triangle, circle, triangle, circle\u2026", "win": "Triangle, circle! Great pattern!"}, {"say": "Stretch! Colour and shape.", "stretch": true, "seq": ["ci_red", "sq_blue", "ci_red", "sq_blue"], "answer": ["ci_red", "sq_blue"], "choices": ["ci_red", "sq_blue", "sq_red", "ci_blue"], "labels": {"ci_red": "red circle", "sq_blue": "blue square", "sq_red": "red square", "ci_blue": "blue circle"}, "oops": "Look at the colour and the shape!", "win": "Red circle, blue square! Two things at once!"}];
let r=0, filled=[];
const $=id=>document.getElementById(id);
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
let AC=null;
function tone(type){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, g=AC.createGain(); g.connect(AC.destination);
    if(type==='beep'||type==='boop'||type==='stamp'){
      const o=AC.createOscillator(); o.type= type==='stamp'?'sine':'square'; o.frequency.value= type==='beep'?880: type==='boop'?330:90;
      g.gain.setValueAtTime(type==='stamp'?0.6:0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+(type==='stamp'?0.25:0.22));
      o.connect(g); o.start(t); o.stop(t+0.3);
    } else {
      const len=type==='shake'?0.25:0.08, buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type=type==='shake'?'bandpass':'highpass'; f.frequency.value=type==='shake'?5000:1500;
      g.gain.setValueAtTime(0.5,t); src.connect(f); f.connect(g); src.start(t);
    }
  }catch(e){}
}
function hasSound(k){ return ROUNDS[r].sounds && ROUNDS[r].sounds[k]; }
async function listen(){ const R=ROUNDS[r]; const els=[...document.querySelectorAll('#seq .it')];
  for(let i=0;i<R.seq.length;i++){ els[i].classList.add('now'); tone(R.sounds[R.seq[i]]); await new Promise(x=>setTimeout(x,550)); els[i].classList.remove('now'); } }
function draw(){
  const R=ROUNDS[r];
  const items=R.seq.map(k=>`<div class="it">${ICONS[k]}</div>`).concat(R.answer.map((k,i)=>`<div class="it ${filled[i]?'':'blank'} ${i===filled.length?'now':''}">${filled[i]?ICONS[filled[i]]:ICONS.qmark}</div>`));
  $('seq').innerHTML=items.join('');
}
function build(){
  const R=ROUNDS[r]; filled=[];
  $('round').textContent=`Round ${r+1} of ${ROUNDS.length}`+(R.stretch?' · Stretch':'');
  $('say').textContent=R.say; $('win').classList.remove('show');
  $('tray').style.gridTemplateColumns=`repeat(${R.choices.length},1fr)`;
  $('tray').innerHTML=R.choices.map(k=>`<button class="card" data-k="${k}" aria-label="${R.labels[k]}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>pick(c.dataset.k));
  draw(); $('listen').hidden=!R.sounds;
  if(R.sounds){ speak(R.say); } else { speak(R.say+' '+R.seq.map(k=>R.labels[k]).join(', ')+', what comes next?'); }
}
function pick(k){
  const R=ROUNDS[r]; if(filled.length>=R.answer.length) return;
  if(hasSound(k)) tone(R.sounds[k]); else speak(R.labels[k]);
  if(k!==R.answer[filled.length]){
    const t=R.oops||'Not yet! Say the pattern out loud and listen.'; $('say').textContent=t; speak(t);
    $('seq').classList.add('shake'); setTimeout(()=>$('seq').classList.remove('shake'),500); return;
  }
  filled.push(k); draw();
  if(filled.length===R.answer.length){
    $('say').textContent='You did it!'; $('winsay').textContent=R.win; $('win').classList.add('show'); speak('You did it! '+R.win);
    $('next').textContent=r<ROUNDS.length-1?'Next ▶':'Play again ↻';
  }
}
$('listen').onclick=listen;
$('undo').onclick=()=>{ filled.pop(); draw(); };
$('next').onclick=()=>{ r=(r+1)%ROUNDS.length; build(); window.scrollTo({top:0,behavior:'smooth'}); };
$('speak').onclick=()=>speak($('say').textContent);
build();
</script>
</body>
</html>
