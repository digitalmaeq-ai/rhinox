<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Week 3</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found them all! Now tap the machine that follows instructions.</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Yes! A washing machine does what people tell it.</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"walk": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"96\" cy=\"48\" r=\"20\" fill=\"#8D5524\"/><path d=\"M78 42 Q96 14 114 42 Q96 30 78 42Z\" fill=\"#1d1d1d\"/><circle cx=\"87\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"105\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M87 60 Q96 68 105 60\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"80\" y=\"68\" width=\"32\" height=\"44\" rx=\"12\" fill=\"#F7931E\"/><path d=\"M86 108 L70 150\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M104 108 L122 148\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M82 76 L62 100\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M110 76 L130 96\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><ellipse cx=\"146\" cy=\"172\" rx=\"7\" ry=\"11\" fill=\"#3BB273\" opacity=\".7\" transform=\"rotate(90 146 172)\"/><ellipse cx=\"172\" cy=\"160\" rx=\"7\" ry=\"11\" fill=\"#3BB273\" opacity=\".7\" transform=\"rotate(90 172 160)\"/><path d=\"M140 120 L176 120 M164 108 L178 120 L164 132\" stroke=\"#3BB273\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "stop": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><polygon points=\"70,30 130,30 172,72 172,128 130,170 70,170 28,128 28,72\" fill=\"#D9534F\" stroke=\"#ffffff\" stroke-width=\"6\"/><rect x=\"86\" y=\"66\" width=\"12\" height=\"44\" rx=\"6\" fill=\"#fff\"/><rect x=\"100\" y=\"58\" width=\"12\" height=\"52\" rx=\"6\" fill=\"#fff\"/><rect x=\"114\" y=\"62\" width=\"12\" height=\"48\" rx=\"6\" fill=\"#fff\"/><rect x=\"128\" y=\"74\" width=\"11\" height=\"38\" rx=\"5.5\" fill=\"#fff\"/><path d=\"M84 98 L74 88 Q66 82 72 96 L86 124 Q94 140 112 140 L122 140 Q138 140 139 120 L139 100 L84 100 Z\" fill=\"#fff\"/></svg>", "clap": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><g transform=\"rotate(-18 92 104)\"><rect x=\"66\" y=\"56\" width=\"40\" height=\"80\" rx=\"20\" fill=\"#8D5524\"/></g><g transform=\"rotate(18 108 104)\"><rect x=\"96\" y=\"56\" width=\"40\" height=\"80\" rx=\"20\" fill=\"#6B3F1A\"/></g><path d=\"M60 40 L48 26\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M100 30 L100 12\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M140 40 L152 26\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M44 80 L28 76\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M156 80 L172 76\" stroke=\"#8E5BD9\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><rect x=\"70\" y=\"140\" width=\"60\" height=\"30\" rx=\"12\" fill=\"#F7931E\"/></svg>", "pickup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><circle cx=\"92\" cy=\"52\" r=\"20\" fill=\"#8D5524\"/><path d=\"M74 46 Q92 18 110 46 Q92 34 74 46Z\" fill=\"#1d1d1d\"/><circle cx=\"83\" cy=\"54\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"101\" cy=\"54\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M83 64 Q92 72 101 64\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M80 70 Q100 66 116 88 L118 120 L84 120 Z\" fill=\"#F7931E\"/><path d=\"M90 120 L84 160\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M108 120 L114 160\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M112 86 L136 132\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><circle cx=\"146\" cy=\"146\" r=\"20\" fill=\"#8E5BD9\"/><path d=\"M128 140 Q146 132 164 140\" stroke=\"#fff\" stroke-width=\"3\" fill=\"none\"/><path d=\"M150 106 L150 92 M142 100 L150 92 L158 100\" stroke=\"#3BB273\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "toy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"112\" r=\"46\" fill=\"#C68642\"/><circle cx=\"62\" cy=\"64\" r=\"18\" fill=\"#C68642\"/><circle cx=\"138\" cy=\"64\" r=\"18\" fill=\"#C68642\"/><circle cx=\"62\" cy=\"64\" r=\"9\" fill=\"#E8B07A\"/><circle cx=\"138\" cy=\"64\" r=\"9\" fill=\"#E8B07A\"/><circle cx=\"100\" cy=\"80\" r=\"34\" fill=\"#C68642\"/><ellipse cx=\"100\" cy=\"92\" rx=\"14\" ry=\"10\" fill=\"#E8B07A\"/><circle cx=\"100\" cy=\"88\" r=\"4\" fill=\"#1d1d1d\"/><circle cx=\"88\" cy=\"74\" r=\"4\" fill=\"#1d1d1d\"/><circle cx=\"112\" cy=\"74\" r=\"4\" fill=\"#1d1d1d\"/><ellipse cx=\"100\" cy=\"128\" rx=\"24\" ry=\"20\" fill=\"#E8B07A\"/><path d=\"M86 110 L100 118 L114 110 L114 122 L100 116 L86 122Z\" fill=\"#168fe5\"/></svg>", "washer": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><rect x=\"44\" y=\"30\" width=\"112\" height=\"144\" rx=\"12\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"5\"/><line x1=\"44\" y1=\"62\" x2=\"156\" y2=\"62\" stroke=\"#16324F\" stroke-width=\"4\"/><circle cx=\"64\" cy=\"46\" r=\"6\" fill=\"#3BB273\"/><circle cx=\"84\" cy=\"46\" r=\"6\" fill=\"#FFC93C\"/><rect x=\"112\" y=\"40\" width=\"30\" height=\"12\" rx=\"3\" fill=\"#168fe5\"/><circle cx=\"100\" cy=\"116\" r=\"40\" fill=\"#cfe9fb\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M68 122 Q84 108 100 122 Q116 136 132 122 L132 140 Q100 162 68 140Z\" fill=\"#168fe5\" opacity=\".8\"/></svg>", "school": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"104\" y=\"70\" width=\"80\" height=\"70\" fill=\"#F3D9B1\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M98 72 L144 40 L190 72 Z\" fill=\"#D9534F\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"134\" y=\"106\" width=\"20\" height=\"34\" fill=\"#16324F\"/><rect x=\"112\" y=\"84\" width=\"16\" height=\"14\" fill=\"#168fe5\"/><rect x=\"160\" y=\"84\" width=\"16\" height=\"14\" fill=\"#168fe5\"/><line x1=\"144\" y1=\"40\" x2=\"144\" y2=\"18\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M144 18 L164 24 L144 30Z\" fill=\"#3BB273\"/><rect x=\"10\" y=\"150\" width=\"180\" height=\"12\" rx=\"6\" fill=\"#cfd8e3\"/><circle cx=\"56\" cy=\"76\" r=\"18\" fill=\"#8D5524\"/><path d=\"M40 70 Q56 44 72 70 Q56 60 40 70Z\" fill=\"#1d1d1d\"/><circle cx=\"47\" cy=\"78\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"65\" cy=\"78\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M47 88 Q56 96 65 88\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"94\" width=\"32\" height=\"34\" rx=\"10\" fill=\"#F7931E\"/><rect x=\"28\" y=\"96\" width=\"14\" height=\"26\" rx=\"5\" fill=\"#8E5BD9\"/><path d=\"M48 126 L40 150\" stroke=\"#16324F\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M64 126 L74 150\" stroke=\"#16324F\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M70 102 L84 116\" stroke=\"#8D5524\" stroke-width=\"8\" stroke-linecap=\"round\"/></svg>"};
const CFG = {"names": {"walk": "walk", "stop": "stop", "clap": "clap", "pickup": "pick up"}, "choices": ["toy", "washer", "school"], "answer": "washer", "ask": "You found them all! Now tap the machine that follows instructions.", "yes": "Yes! A washing machine does what people tell it.", "no": "Hmm, that is not a machine. Try again."}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
