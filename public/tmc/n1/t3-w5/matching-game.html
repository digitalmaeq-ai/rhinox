<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 3 · Week 5</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found them all! What is the FIRST card in our build plan?</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Blocks first! Then plank, then test.</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>

oke-width=\"4\"/><rect x=\"66\" y=\"58\" width=\"68\" height=\"36\" rx=\"3\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/></g><g transform=\"rotate(40 140 60)\"><rect x=\"110\" y=\"20\" width=\"70\" height=\"36\" rx=\"3\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\"/></g></svg>", "bridge_strong": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M10 150 Q50 140 100 152 Q150 162 190 150 L190 176 L10 176Z\" fill=\"#7cc4ff\"/><rect x=\"24\" y=\"110\" width=\"36\" height=\"40\" rx=\"3\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"140\" y=\"110\" width=\"36\" height=\"40\" rx=\"3\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"16\" y=\"98\" width=\"168\" height=\"14\" rx=\"3\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\"/><g transform=\"translate(80,74)\"><rect x=\"0\" y=\"0\" width=\"40\" height=\"16\" rx=\"5\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"8\" y=\"-9\" width=\"22\" height=\"11\" rx=\"3\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"9\" cy=\"18\" r=\"5\" fill=\"#16324F\"/><circle cx=\"31\" cy=\"18\" r=\"5\" fill=\"#16324F\"/></g></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>", "plank": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"20\" y=\"88\" width=\"160\" height=\"22\" rx=\"4\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M40 99 L80 99 M100 96 L150 96\" stroke=\"#8a5a2b\" stroke-width=\"3\"/></svg>", "hardhat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"112\" r=\"56\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"6\"/><circle cx=\"100\" cy=\"116\" r=\"34\" fill=\"#8D5524\"/><circle cx=\"90\" cy=\"118\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"110\" cy=\"118\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M90 128 Q100 136 110 128\" stroke=\"#1d1d1d\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M58 98 Q60 56 100 54 Q140 56 142 98Z\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"48\" y=\"94\" width=\"104\" height=\"10\" rx=\"4\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"94\" y=\"56\" width=\"12\" height=\"38\" fill=\"#e6b52e\"/></svg>", "test": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M10 150 Q50 140 100 152 Q150 162 190 150 L190 176 L10 176Z\" fill=\"#7cc4ff\"/><rect x=\"24\" y=\"110\" width=\"36\" height=\"40\" rx=\"3\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"140\" y=\"110\" width=\"36\" height=\"40\" rx=\"3\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"16\" y=\"98\" width=\"168\" height=\"14\" rx=\"3\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\"/><g transform=\"translate(118,74)\"><rect x=\"0\" y=\"0\" width=\"40\" height=\"16\" rx=\"5\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"8\" y=\"-9\" width=\"22\" height=\"11\" rx=\"3\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"9\" cy=\"18\" r=\"5\" fill=\"#16324F\"/><circle cx=\"31\" cy=\"18\" r=\"5\" fill=\"#16324F\"/></g><path d=\"M50 60 L100 60\" stroke=\"#3BB273\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M86 48 L100 60 L86 72\" fill=\"none\" stroke=\"#3BB273\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "tower_strong": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><rect x=\"14\" y=\"160\" width=\"172\" height=\"8\" fill=\"#c9dcef\"/><rect x=\"50\" y=\"124\" width=\"100\" height=\"36\" rx=\"3\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"62\" y=\"88\" width=\"76\" height=\"36\" rx=\"3\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"74\" y=\"52\" width=\"52\" height=\"36\" rx=\"3\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"86\" y=\"24\" width=\"28\" height=\"28\" rx=\"3\" fill=\"#8E5BD9\" stroke=\"#16324F\" stroke-width=\"4\"/></svg>", "roll": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M20 160 L180 160 L20 80Z\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><circle cx=\"96\" cy=\"104\" r=\"18\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M84 96 Q96 110 108 96\" stroke=\"#fff\" stroke-width=\"3\" fill=\"none\"/><path d=\"M130 100 A30 30 0 0 1 150 130\" stroke=\"#168fe5\" stroke-width=\"6\" fill=\"none\"/><path d=\"M142 128 L150 132 L154 122\" stroke=\"#168fe5\" stroke-width=\"6\" fill=\"none\"/></svg>", "ramp": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M20 160 L180 160 L180 70Z\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><g transform=\"rotate(-29 120 110)\"><g transform=\"translate(100,92)\"><rect x=\"0\" y=\"0\" width=\"40\" height=\"16\" rx=\"5\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"8\" y=\"-9\" width=\"22\" height=\"11\" rx=\"3\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"9\" cy=\"18\" r=\"5\" fill=\"#16324F\"/><circle cx=\"31\" cy=\"18\" r=\"5\" fill=\"#16324F\"/></g></g><path d=\"M60 150 L90 150\" stroke=\"#168fe5\" stroke-width=\"6\"/><path d=\"M60 150 L72 142 M60 150 L72 158\" stroke=\"#168fe5\" stroke-width=\"6\" stroke-linecap=\"round\"/></svg>", "river": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M10 80 Q50 66 100 82 Q150 96 190 80 L190 130 Q150 146 100 130 Q50 114 10 130Z\" fill=\"#7cc4ff\" stroke=\"#168fe5\" stroke-width=\"4\"/><path d=\"M40 100 Q50 94 60 100 M120 108 Q130 102 140 108\" stroke=\"#fff\" stroke-width=\"4\" fill=\"none\"/></svg>", "pull": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><rect x=\"14\" y=\"150\" width=\"172\" height=\"8\" fill=\"#c9dcef\"/><rect x=\"40\" y=\"110\" width=\"50\" height=\"40\" rx=\"3\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M90 130 Q120 120 150 112\" stroke=\"#16324F\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"156\" cy=\"110\" r=\"14\" fill=\"#8D5524\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M120 80 L170 80\" stroke=\"#168fe5\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M156 68 L170 80 L156 92\" fill=\"none\" stroke=\"#168fe5\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "blocks": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"40\" y=\"110\" width=\"40\" height=\"40\" rx=\"3\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"90\" y=\"110\" width=\"40\" height=\"40\" rx=\"3\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"65\" y=\"66\" width=\"40\" height=\"40\" rx=\"3\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"130\" y=\"120\" width=\"30\" height=\"30\" rx=\"3\" fill=\"#8E5BD9\" stroke=\"#16324F\" stroke-width=\"4\"/></svg>", "bridge_weak": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M10 150 Q50 140 100 152 Q150 162 190 150 L190 176 L10 176Z\" fill=\"#7cc4ff\"/><rect x=\"24\" y=\"110\" width=\"36\" height=\"40\" rx=\"3\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M20 104 L110 104 L176 150\" stroke=\"#C8955C\" stroke-width=\"14\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M20 104 L110 104 L176 150\" stroke=\"#16324F\" stroke-width=\"2\" fill=\"none\"/><g transform=\"rotate(32 150 120)\"><g transform=\"translate(128,108)\"><rect x=\"0\" y=\"0\" width=\"40\" height=\"16\" rx=\"5\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"8\" y=\"-9\" width=\"22\" height=\"11\" rx=\"3\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"9\" cy=\"18\" r=\"5\" fill=\"#16324F\"/><circle cx=\"31\" cy=\"18\" r=\"5\" fill=\"#16324F\"/></g></g></svg>"};
const CFG = {"names": {"blocks": "blocks", "plank": "plank", "test": "test", "hardhat": "Ayo the engineer"}, "answer": "blocks", "choices": ["test", "blocks", "plank"], "ask": "You found them all! What is the FIRST card in our build plan?", "yes": "Blocks first! Then plank, then test.", "no": "That comes later. What do we put down first?"}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
