<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy, Change, Make</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--bg:#F4F9FF;--card:#fff;--ink:#16324F}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--blue);color:var(--navy);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0 8px;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #d8e8f8}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);color:var(--navy);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.round{font-weight:800;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);margin:18px 0}
.slot{aspect-ratio:1/1.1;border:4px dashed #9cc9f0;border-radius:24px;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .num{position:absolute;top:8px;left:12px;font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--blue)}
.slot .lbl{position:absolute;bottom:6px;width:100%;text-align:center;font-weight:800;font-size:clamp(13px,2.6vw,18px);color:#5b7a98}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot svg,.card svg{width:78%;height:auto}
.arrows{display:flex;justify-content:space-around;margin-top:-10px;color:var(--blue);font-size:28px;font-weight:900}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);min-height:120px;margin-top:6px}
.card{border:0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 0 #c9dcef;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #c9dcef}
.card.gone{visibility:hidden}
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:6px auto 0;opacity:.95}
.model div{background:#fff;border-radius:16px;padding:4px;border:3px solid var(--orange);position:relative}
.model div b{position:absolute;top:2px;left:8px;color:var(--orange);font-weight:900}
.model svg{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c9dcef}
.btn[disabled]{opacity:.45;cursor:default}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{display:none;text-align:center;padding:10px}
.win.show{display:block}
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.note{font-size:12px;color:#5b7a98;text-align:center;margin-top:18px}

.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.seq .it{width:min(15vw,96px);aspect-ratio:1;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #d8e8f8}
.seq .it svg{width:92%;height:auto}
.seq .it.blank{outline:4px dashed var(--orange);background:#FFF4D6}
.seq .it.now{outline:5px solid var(--orange)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 2 · Week 8</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <div><div class="round" id="round"></div><p class="say" id="say"></p></div>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>
  <div class="seq" id="seq"></div>
  <p style="text-align:center;font-weight:800;color:#5b7a98;margin:4px 0">What comes next? Tap a card.</p>
  <div class="tray" id="tray"></div>
  <div class="bar"><button class="btn alt" id="listen" hidden>👂 Listen</button><button class="btn alt" id="undo">↩ Undo</button></div>
  <div class="win" id="win">
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p class="say" id="winsay"></p>
    <div class="bar"><button class="btn" id="next">Next ▶</button></div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>

ll=\"#F7931E\"/><path d=\"M94 104 L92 150\" stroke=\"#16324F\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M106 104 L122 122 L114 132\" stroke=\"#16324F\" stroke-width=\"10\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M86 74 L66 92\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M114 74 L134 92\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><circle cx=\"60\" cy=\"172\" r=\"12\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"88\" y=\"160\" width=\"24\" height=\"24\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"140\" cy=\"172\" r=\"12\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"3\"/></svg>", "walk": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"96\" cy=\"48\" r=\"20\" fill=\"#8D5524\"/><path d=\"M78 42 Q96 14 114 42 Q96 30 78 42Z\" fill=\"#1d1d1d\"/><circle cx=\"87\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"105\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M87 60 Q96 68 105 60\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"80\" y=\"68\" width=\"32\" height=\"44\" rx=\"12\" fill=\"#F7931E\"/><path d=\"M86 108 L70 150\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M104 108 L122 148\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M82 76 L62 100\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M110 76 L130 96\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><ellipse cx=\"146\" cy=\"172\" rx=\"7\" ry=\"11\" fill=\"#3BB273\" opacity=\".7\" transform=\"rotate(90 146 172)\"/><ellipse cx=\"172\" cy=\"160\" rx=\"7\" ry=\"11\" fill=\"#3BB273\" opacity=\".7\" transform=\"rotate(90 172 160)\"/><path d=\"M140 120 L176 120 M164 108 L178 120 L164 132\" stroke=\"#3BB273\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "stamp": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"84\" y=\"30\" width=\"30\" height=\"96\" rx=\"14\" fill=\"#16324F\"/><path d=\"M70 120 Q72 104 90 104 L118 104 Q150 108 152 132 L152 146 L66 146 Z\" fill=\"#F7931E\"/><rect x=\"62\" y=\"142\" width=\"96\" height=\"10\" rx=\"5\" fill=\"#1d1d1d\"/><path d=\"M40 168 L160 168\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M48 150 L30 140\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M164 150 L180 140\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M44 128 L24 124\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M168 128 L186 124\" stroke=\"#3BB273\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/></svg>", "wave": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><rect x=\"116\" y=\"30\" width=\"62\" height=\"146\" rx=\"4\" fill=\"#B5651D\" stroke=\"#16324F\" stroke-width=\"4\"/><circle cx=\"166\" cy=\"108\" r=\"5\" fill=\"#FFC93C\"/><rect x=\"124\" y=\"40\" width=\"46\" height=\"40\" rx=\"3\" fill=\"#cfe9fb\"/><circle cx=\"70\" cy=\"62\" r=\"20\" fill=\"#8D5524\"/><path d=\"M52 56 Q70 28 88 56 Q70 44 52 56Z\" fill=\"#1d1d1d\"/><circle cx=\"61\" cy=\"64\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"79\" cy=\"64\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M61 74 Q70 82 79 74\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"54\" y=\"82\" width=\"32\" height=\"46\" rx=\"12\" fill=\"#F7931E\"/><path d=\"M62 126 L58 168\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M78 126 L82 168\" stroke const ROUNDS = [{"say": "1. Copy it! Ayo\u2019s dance: jump, clap, jump, clap. Keep it going.", "seq": ["jump", "clap", "jump", "clap"], "answer": ["jump", "clap"], "choices": ["jump", "clap", "stamp"], "labels": {"jump": "jump", "clap": "clap", "stamp": "stamp"}, "oops": "Copy it: jump, clap, jump, clap\u2026", "win": "Jump, clap! You copied it!"}, {"say": "2. Change it! Clap becomes stamp. Fill in the new move.", "seq": ["jump", "?", "jump", "?", "jump", "?"], "answer": ["stamp", "stamp", "stamp"], "choices": ["clap", "stamp", "walk"], "labels": {"clap": "clap", "stamp": "stamp", "walk": "walk"}, "oops": "We changed clap to stamp. Which card is stamp?", "win": "Jump, stamp, jump, stamp! A new pattern!"}, {"say": "Change it again! Jump becomes march.", "seq": ["?", "clap", "?", "clap", "?", "clap"], "answer": ["march", "march", "march"], "choices": ["jump", "march", "wave"], "labels": {"jump": "jump", "march": "march", "wave": "wave"}, "oops": "We changed jump to march. Which card is march?", "win": "March, clap, march, clap! Still a pattern!"}, {"say": "3. Make it! Choose card A, then a different card B. Ayo will dance it three times.", "create": true, "seq": [], "answer": [], "choices": ["jump", "clap", "stamp", "march", "wave"], "labels": {"jump": "jump", "clap": "clap", "stamp": "stamp", "march": "march", "wave": "wave"}, "oops": "That is the same move! Choose a different move for B.", "win": "That is your own pattern! Now dance it with Ayo."}, {"say": "Make a colour pattern too! Choose A, then a different B.", "create": true, "seq": [], "answer": [], "choices": ["red", "blue", "yellow", "green"], "labels": {"red": "red", "blue": "blue", "yellow": "yellow", "green": "green"}, "oops": "Same colour! Choose a different colour for B.", "win": "Your own colour pattern!"}];

const $=id=>document.getElementById(id);
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
let AC=null;
function tone(type){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, g=AC.createGain(); g.connect(AC.destination);
    if(type==='beep'||type==='boop'||type==='stamp'){
      const o=AC.createOscillator(); o.type= type==='stamp'?'sine':'square'; o.frequency.value= type==='beep'?880: type==='boop'?330:90;
      g.gain.setValueAtTime(type==='stamp'?0.6:0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+(type==='stamp'?0.25:0.22));

    } else {
      const len=type==='shake'?0.25:0.08, buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate), d=buf.getChannelData(0);

      const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type=type==='shake'?'bandpass':'highpass'; f.frequency.value=type==='shake'?5000:1500;
      g.gain.setValueAtTime(0.5,t); src.connect(f); f.connect(g); src.start(t);
    }
  }catch(e){}
}
function hasSound(k){ return ROUNDS[r].sounds && ROUNDS[r].sounds[k]; }
async function listen(){ const R=ROUNDS[r]; const els=[...document.querySelectorAll('#seq .it')];
  for(let i=0;i<R.seq.length;i++){ els[i].classList.add('now'); tone(R.sounds[R.seq[i]]); await new Promise(x=>setTimeout(x,550)); els[i].classList.remove('now'); } }
let found=false;
function slots(){ const R=ROUNDS[r]; // positions to fill, in order
  if(R.fixAt!==undefined) return found?[R.fixAt]:[];
  const g=R.seq.map((k,i)=>k==='?'?i:-1).filter(i=>i>=0); return g.length?g:null; }
function draw(){
  const R=ROUNDS[r]; const sl=slots();
  let items;
  if(R.create){
    const full=filled.length===2?[0,1,0,1,0,1].map(i=>filled[i]):filled;
    items=Array.from({length:6},(_,i)=>full[i]?`<div class="it">${ICONS[full[i]]}</div>`:`<div class="it blank ${i===filled.length?'now':''}">${i<2?'<b style="font-size:28px;color:#F7931E">'+(i?'B':'A')+'</b>':ICONS.qmark}</div>`);
  } else if(sl===null){
    items=R.seq.map(k=>`<div class="it">${ICONS[k]}</div>`).concat(R.answer.map((k,i)=>`<div class="it ${filled[i]?'':'blank'} ${i===filled.length?'now':''}">${filled[i]?ICONS[filled[i]]:ICONS.qmark}</div>`));
  } else {
    items=R.seq.map((k,i)=>{ const j=sl.indexOf(i);
      if(j>=0) return `<div class="it ${filled[j]?'':'blank'} ${j===filled.length?'now':''}">${filled[j]?ICONS[filled[j]]:ICONS.qmark}</div>`;
      return `<div class="it" data-i="${i}" ${R.fixAt!==undefined&&!found?'style="cursor:pointer"':''}>${ICONS[k]}</div>`; });
  }
  $('seq').innerHTML=items.join('');
  if(R.fixAt!==undefined && !found) document.querySelectorAll('#seq .it').forEach(el=>el.onclick=()=>findMistake(+el.dataset.i));
}
function findMistake(i){
  const R=ROUNDS[r];
  if(i===R.fixAt){ found=true; const t='Yes, that one is wrong! Now choose the right card.'; $('say').textContent=t; speak(t); draw(); }
  else { const t='That one is fine. Say the pattern and find the mistake.'; $('say').textContent=t; speak(t); $('seq').classList.add('shake'); setTimeout(()=>$('seq').classList.remove('shake'),500); }
}
function build(){
  const R=ROUNDS[r]; filled=[]; found=false;
  $('round').textContent=`Round ${r+1} of ${ROUNDS.length}`+(R.stretch?' · Stretch':'');
  $('say').textContent=R.say; $('win').classList.remove('show');
  $('tray').style.gridTemplateColumns=`repeat(${R.choices.length},1fr)`;
  $('tray').innerHTML=R.choices.map(k=>`<button class="card" data-k="${k}" aria-label="${R.labels[k]}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>pick(c.dataset.k));
  draw(); $('listen').hidden=!R.sounds;
  if(R.create||R.sounds||R.fixAt!==undefined||R.seq.includes('?')){ speak(R.say); } else { speak(R.say+' '+R.seq.map(k=>R.labels[k]).join(', ')+', what comes next?'); }
}
function pick(k){
  const R=ROUNDS[r]; if(R.fixAt!==undefined && !found){ const t='First tap the mistake in the pattern.'; $('say').textContent=t; speak(t); return; }
  if(R.create){
    if(filled.length>=2) return; speak(R.labels[k]);
    if(filled.length===1 && k===filled[0]){ const t=R.oops||'Choose a different move for B!'; $('say').textContent=t; speak(t);
      $('seq').classList.add('shake'); setTimeout(()=>$('seq').classList.remove('shake'),500); return; }
    filled.push(k); draw();
    if(filled.length===1){ const t='Now choose B: a different one.'; $('say').textContent=t; speak(t); }
    if(filled.length===2){ const a=R.labels[filled[0]], b=R.labels[filled[1]]; const A=a.charAt(0).toUpperCase()+a.slice(1); const w=`${A}, ${b}, ${a}, ${b}, ${a}, ${b}! ${R.win}`;
      $('say').textContent='You made your own pattern!'; $('winsay').textContent=w; $('win').classList.add('show'); speak('You made your own pattern! '+w);
      $('next').textContent=r<ROUNDS.length-1?'Next ▶':'Play again ↻';
      const els=[...document.querySelectorAll('#seq .it')]; els.forEach((el,i)=>setTimeout(()=>{els.forEach(e=>e.classList.remove('now')); el.classList.add('now');},400+i*500)); }
    return;
  }
  if(filled.length>=R.answer.length) return;
  if(hasSound(k)) tone(R.sounds[k]); else speak(R.labels[k]);
  if(k!==R.answer[filled.length]){
    const t=R.oops||'Not yet! Say the pattern out loud and listen.'; $('say').textContent=t; speak(t);
    $('seq').classList.add('shake'); setTimeout(()=>$('seq').classList.remove('shake'),500); return;
  }
  filled.push(k); draw();
  if(filled.length===R.answer.length){
    $('say').textContent='You did it!'; $('winsay').textContent=R.win; $('win').classList.add('show'); speak('You did it! '+R.win);
    $('next').textContent=r<ROUNDS.length-1?'Next ▶':'Play again ↻';
  }
}
$('listen').onclick=listen;
$('undo').onclick=()=>{ filled.pop(); draw(); };
window.__found=()=>found;
$('next').onclick=()=>{ r=(r+1)%ROUNDS.length; build(); window.scrollTo({top:0,behavior:'smooth'}); };
$('speak').onclick=()=>speak($('say').textContent);
build();
</script>
</body>
