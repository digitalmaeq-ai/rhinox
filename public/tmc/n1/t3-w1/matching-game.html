<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 3 · Week 1</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found all the problems! Which picture means “help”?</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Yes! Helping hands. We can ask for help!</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"danger": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><path d=\"M100 30 L176 160 L24 160Z\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"7\" stroke-linejoin=\"round\"/><rect x=\"92\" y=\"70\" width=\"16\" height=\"52\" rx=\"6\" fill=\"#16324F\"/><circle cx=\"100\" cy=\"140\" r=\"9\" fill=\"#16324F\"/></svg>", "doorshut": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><rect x=\"56\" y=\"28\" width=\"88\" height=\"150\" rx=\"4\" fill=\"#8a5a2b\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"128\" cy=\"104\" r=\"7\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"2\"/><rect x=\"64\" y=\"40\" width=\"72\" height=\"50\" rx=\"3\" fill=\"none\" stroke=\"#6b4421\" stroke-width=\"3\"/><rect x=\"64\" y=\"104\" width=\"72\" height=\"62\" rx=\"3\" fill=\"none\" stroke=\"#6b4421\" stroke-width=\"3\"/><g transform=\"translate(36,150) scale(0.9)\"><circle r=\"26\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"3\"/><circle cy=\"-1\" r=\"15\" fill=\"#8D5524\"/><path d=\"M-15 -3 Q0 -21 15 -3 Q0 -15 -15 -3Z\" fill=\"#1d1d1d\"/><circle cx=\"-4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><circle cx=\"4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><path d=\"M-4 7 Q0 4 4 7\" stroke=\"#1d1d1d\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>", "ayotoken": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><circle cx=\"100\" cy=\"100\" r=\"92\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"8\"/><circle cx=\"100\" cy=\"96\" r=\"48\" fill=\"#8D5524\"/><path d=\"M54 90 Q100 34 146 90 Q100 50 54 90Z\" fill=\"#1d1d1d\"/><circle cx=\"91\" cy=\"98\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"109\" cy=\"98\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M91 108 Q100 116 109 108\" stroke=\"#1d1d1d\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "blocked": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><rect x=\"14\" y=\"146\" width=\"172\" height=\"10\" rx=\"4\" fill=\"#c9dcef\"/><rect x=\"150\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"182\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"161\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"167\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"173\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><g transform=\"translate(42,118) scale(1)\"><circle r=\"26\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"3\"/><circle cy=\"-1\" r=\"15\" fill=\"#8D5524\"/><path d=\"M-15 -3 Q0 -21 15 -3 Q0 -15 -15 -3Z\" fill=\"#1d1d1d\"/><circle cx=\"-4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><circle cx=\"4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><path d=\"M-4 7 Q0 4 4 7\" stroke=\"#1d1d1d\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><rect x=\"82\" y=\"86\" width=\"56\" height=\"60\" rx=\"4\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M82 104 L138 104 M110 86 L110 146\" stroke=\"#8a5a2b\" stroke-width=\"3\"/></svg>", "star_outline": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><polygon points=\"100.0,28.0 78.8,78.9 23.9,83.3 65.8,119.1 53.0,172.7 100.0,144.0 147.0,172.7 134.2,119.1 176.1,83.3 121.2,78.9\" fill=\"#FFFFFF\" stroke=\"#16324F\" stroke-width=\"7\" stroke-linejoin=\"round\"/></svg>", "shoes": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M32 52 L66 52 L72 78 Q106 84 108 104 L108 112 L28 112 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"26\" y=\"108\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M40 66 L62 62 M40 76 L64 72\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M96 100 L130 100 L136 126 Q170 132 172 152 L172 160 L92 160 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"90\" y=\"156\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M104 114 L126 110 M104 124 L128 120\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "clearpath": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"14\" y=\"146\" width=\"172\" height=\"10\" rx=\"4\" fill=\"#c9dcef\"/><rect x=\"150\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"182\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"161\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"167\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"173\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><g transform=\"translate(70,118) scale(1)\"><circle r=\"26\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"3\"/><circle cy=\"-1\" r=\"15\" fill=\"#8D5524\"/><path d=\"M-15 -3 Q0 -21 15 -3 Q0 -15 -15 -3Z\" fill=\"#1d1d1d\"/><circle cx=\"-4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><circle cx=\"4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><path d=\"M-4 5 Q0 9 4 5\" stroke=\"#1d1d1d\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><path d=\"M100 120 L130 120\" stroke=\"#3BB273\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M124 110 L138 120 L124 130\" fill=\"none\" stroke=\"#3BB273\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "toycar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"34\" y=\"88\" width=\"132\" height=\"40\" rx=\"10\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M62 88 L80 60 L124 60 L142 88\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><circle cx=\"66\" cy=\"132\" r=\"15\" fill=\"#16324F\"/><circle cx=\"66\" cy=\"132\" r=\"5\" fill=\"#ccc\"/><circle cx=\"136\" cy=\"132\" r=\"15\" fill=\"#16324F\"/><circle cx=\"136\" cy=\"132\" r=\"5\" fill=\"#ccc\"/></svg>", "fixed": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"#3BB273\"/><path d=\"M66 102 L90 126 L138 76\" stroke=\"#fff\" stroke-width=\"16\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "opendoor": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"60\" y=\"28\" width=\"96\" height=\"148\" rx=\"4\" fill=\"#3b2a1a\"/><path d=\"M60 28 L118 44 L118 166 L60 176 Z\" fill=\"#B5651D\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><circle cx=\"108\" cy=\"104\" r=\"5\" fill=\"#FFC93C\"/><path d=\"M124 100 L160 100\" stroke=\"#3BB273\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M148 88 L162 100 L148 112\" stroke=\"#3BB273\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M30 116 L96 104\" stroke=\"#8D5524\" stroke-width=\"12\" stroke-linecap=\"round\"/><rect x=\"18\" y=\"104\" width=\"26\" height=\"40\" rx=\"10\" fill=\"#F7931E\"/></svg>", "spill": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M40 150 Q60 128 100 140 Q150 128 170 150 Q130 170 90 164 Q50 170 40 150Z\" fill=\"#7cc4ff\" stroke=\"#168fe5\" stroke-width=\"4\"/><g transform=\"rotate(-70 80 110)\"><path d=\"M58 70 L102 70 L96 140 L64 140Z\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/></g><circle cx=\"140\" cy=\"120\" r=\"6\" fill=\"#7cc4ff\"/><circle cx=\"156\" cy=\"132\" r=\"4\" fill=\"#7cc4ff\"/></svg>", "oops": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"#D9534F\"/><path d=\"M72 72 L128 128 M128 72 L72 128\" stroke=\"#fff\" stroke-width=\"16\" stroke-linecap=\"round\"/></svg>", "cupok": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M66 50 L134 50 L124 160 L76 160Z\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M70 82 L130 82 L124 156 L76 156Z\" fill=\"#7cc4ff\"/></svg>", "brokentoy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"34\" y=\"88\" width=\"110\" height=\"40\" rx=\"10\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M58 88 L74 62 L116 62 L130 88\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><circle cx=\"62\" cy=\"132\" r=\"15\" fill=\"#16324F\"/><circle cx=\"62\" cy=\"132\" r=\"5\" fill=\"#ccc\"/><circle cx=\"160\" cy=\"156\" r=\"15\" fill=\"#16324F\"/><circle cx=\"160\" cy=\"156\" r=\"5\" fill=\"#ccc\"/><path d=\"M124 130 L132 140 M138 124 L148 128\" stroke=\"#F7931E\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M118 128 L112 142\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "help": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M30 120 Q60 100 96 112 L128 112 Q140 114 136 126 L106 128\" fill=\"#8D5524\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M170 92 Q140 74 104 86 L74 92 Q62 96 68 106 L96 104\" fill=\"#C68642\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M100 46 C 86 26, 60 44, 100 70 C 140 44, 114 26, 100 46Z\" fill=\"#E5484D\"/></svg>", "solved": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"14\" y=\"146\" width=\"172\" height=\"10\" rx=\"4\" fill=\"#c9dcef\"/><rect x=\"150\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"182\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"161\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"167\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"173\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"30\" y=\"100\" width=\"40\" height=\"46\" rx=\"4\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\"/><g transform=\"translate(118,118) scale(1)\"><circle r=\"26\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"3\"/><circle cy=\"-1\" r=\"15\" fill=\"#8D5524\"/><path d=\"M-15 -3 Q0 -21 15 -3 Q0 -15 -15 -3Z\" fill=\"#1d1d1d\"/><circle cx=\"-4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><circle cx=\"4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><path d=\"M-4 5 Q0 9 4 5\" stroke=\"#1d1d1d\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><circle cx=\"160\" cy=\"40\" r=\"20\" fill=\"#3BB273\"/><path d=\"M150 40 L158 48 L171 32\" stroke=\"#fff\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "shoelace": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><path d=\"M30 130 L40 80 L90 80 L104 108 L160 118 Q176 122 172 146 L30 146Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M30 146 L172 146 L172 156 L30 156Z\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M70 96 Q76 120 60 150 Q50 172 70 178 M84 98 Q100 130 120 166 Q126 178 140 176\" stroke=\"#fff\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M70 96 Q76 120 60 150 Q50 172 70 178 M84 98 Q100 130 120 166 Q126 178 140 176\" stroke=\"#16324F\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></svg>"};
const CFG = {"names": {"blocked": "Ayo is stuck", "spill": "spilled water", "brokentoy": "broken toy", "danger": "danger sign"}, "answer": "help", "choices": ["help", "spill", "doorshut"], "ask": "You found all the problems! Which picture means \u201chelp\u201d?", "yes": "Yes! Helping hands. We can ask for help!", "no": "That one is a problem. Find the helping hands."}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
