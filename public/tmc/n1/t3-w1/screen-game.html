<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problem Spotter</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--bg:#F4F9FF;--card:#fff;--ink:#16324F}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--blue);color:var(--navy);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0 8px;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #d8e8f8}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);color:var(--navy);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.round{font-weight:800;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);margin:18px 0}
.slot{aspect-ratio:1/1.1;border:4px dashed #9cc9f0;border-radius:24px;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .num{position:absolute;top:8px;left:12px;font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--blue)}
.slot .lbl{position:absolute;bottom:6px;width:100%;text-align:center;font-weight:800;font-size:clamp(13px,2.6vw,18px);color:#5b7a98}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot svg,.card svg{width:78%;height:auto}
.arrows{display:flex;justify-content:space-around;margin-top:-10px;color:var(--blue);font-size:28px;font-weight:900}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);min-height:120px;margin-top:6px}
.card{border:0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 0 #c9dcef;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #c9dcef}
.card.gone{visibility:hidden}
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:6px auto 0;opacity:.95}
.model div{background:#fff;border-radius:16px;padding:4px;border:3px solid var(--orange);position:relative}
.model div b{position:absolute;top:2px;left:8px;color:var(--orange);font-weight:900}
.model svg{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c9dcef}
.btn[disabled]{opacity:.45;cursor:default}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{display:none;text-align:center;padding:10px}
.win.show{display:block}
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.note{font-size:12px;color:#5b7a98;text-align:center;margin-top:18px}

.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0;min-height:90px}
.pool .card{width:min(19vw,104px)}
.pool .card.sel{outline:5px solid var(--orange);transform:translateY(-4px)}
.bins{display:grid;gap:10px;margin-top:10px}
.bin{border:4px dashed #9cc9f0;border-radius:24px;background:#fff;min-height:150px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.bin .lab{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;color:var(--navy)}
.bin .lab svg{width:44px;height:44px}
.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.bin .in svg{width:46px;height:46px}
.bin.hint{border-color:var(--orange);background:#FFF4D6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Think • Move • Code! · Nursery 1 · Term 3 · Week 1</div><div class="tag">Optional · just for fun · not a test</div></div>
  <div class="bubble"><div class="bot">Rhino<br>Bot</div><div><div class="round" id="round"></div><p class="say" id="say"></p></div><button class="speak" id="speak" aria-label="Read aloud">🔊</button></div>
  <p style="text-align:center;font-weight:800;color:#5b7a98;margin:4px 0">Tap a picture, then tap its group.</p>
  <div class="pool" id="pool"></div>
  <div class="bins" id="bins"></div>
  <div class="win" id="win"><div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div><p class="say" id="winsay"></p><div class="bar"><button class="btn" id="next">Next ▶</button></div></div>
  <p class="note">Works offline once loaded.</p>
</div>

=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M32 52 L66 52 L72 78 Q106 84 108 104 L108 112 L28 112 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"26\" y=\"108\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M40 66 L62 62 M40 76 L64 72\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M96 100 L130 100 L136 126 Q170 132 172 152 L172 160 L92 160 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"90\" y=\"156\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M104 114 L126 110 M104 124 L128 120\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "clearpath": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"14\" y=\"146\" width=\"172\" height=\"10\" rx=\"4\" fill=\"#c9dcef\"/><rect x=\"150\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"182\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"161\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"167\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"173\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><g transform=\"translate(70,118) scale(1)\"><circle r=\"26\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"3\"/><circle cy=\"-1\" r=\"15\" fill=\"#8D5524\"/><path d=\"M-15 -3 Q0 -21 15 -3 Q0 -15 -15 -3Z\" fill=\"#1d1d1d\"/><circle cx=\"-4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><circle cx=\"4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><path d=\"M-4 5 Q0 9 4 5\" stroke=\"#1d1d1d\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><path d=\"M100 120 L130 120\" stroke=\"#3BB273\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M124 110 L138 120 L124 130\" fill=\"none\" stroke=\"#3BB273\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "toycar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"34\" y=\"88\" width=\"132\" height=\"40\" rx=\"10\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M62 88 L80 60 L124 60 L142 88\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><circle cx=\"66\" cy=\"132\" r=\"15\" fill=\"#16324F\"/><circle cx=\"66\" cy=\"132\" r=\"5\" fill=\"#ccc\"/><circle cx=\"136\" cy=\"132\" r=\"15\" fill=\"#16324F\"/><circle cx=\"136\" cy=\"132\" r=\"5\" fill=\"#ccc\"/></svg>", "fixed": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"#3BB273\"/><path d=\"M66 102 L90 126 L138 76\" stroke=\"#fff\" stroke-width=\"16\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "opendoor": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"60\" y=\"28\" width=\"96\" height=\"148\" rx=\"4\" fill=\"#3b2a1a\"/><path d=\"M60 28 L118 44 L118 166 L60 176 Z\" fill=\"#B5651D\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><circle cx=\"108\" cy=\"104\" r=\"5\" fill=\"#FFC93C\"/><path d=\"M124 100 L160 100\" stroke=\"#3BB273\" stroke-width=\"7\" stroke-linecap=\"round\"/><path d=\"M148 88 L162 100 L148 112\" stroke=\"#3BB273\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M30 116 L96 104\" stroke=\"#8D5524\" stroke-width=\"12\" stroke-linecap=\"round\"/><rect x=\"18\" y=\"104\" width=\"26\" height=\"40\" rx=\"10\" fill=\"#F7931E\"/></svg>", "spill": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M40 150 Q60 128 100 140 Q150 128 170 150 Q130 170 90 164 Q50 170 40 150Z\" fill=\"#7cc4ff\" stroke=\"#168fe5\" stroke-width=\"4\"/><g transform=\"rotate(-70 80 110)\"><path d=\"M58 70 L102 70 L96 140 L64 140Z\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/></g><circle cx=\"140\" cy=\"120\" r=\"6\" fill=\"#7cc4ff\"/><circle cx=\"156\" cy=\"132\" r=\"4\" fill=\"#7cc4ff\"/></svg>", "oops": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"#D9534F\"/><path d=\"M72 72 L128 128 M128 72 L72 128\" stroke=\"#fff\" stroke-width=\"16\" stroke-linecap=\"round\"/></svg>", "cupok": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M66 50 L134 50 L124 160 L76 160Z\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M70 82 L130 82 L124 156 L76 156Z\" fill=\"#7cc4ff\"/></svg>", "brokentoy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"34\" y=\"88\" width=\"110\" height=\"40\" rx=\"10\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M58 88 L74 62 L116 62 L130 88\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><circle cx=\"62\" cy=\"132\" r=\"15\" fill=\"#16324F\"/><circle cx=\"62\" cy=\"132\" r=\"5\" fill=\"#ccc\"/><circle cx=\"160\" cy=\"156\" r=\"15\" fill=\"#16324F\"/><circle cx=\"160\" cy=\"156\" r=\"5\" fill=\"#ccc\"/><path d=\"M124 130 L132 140 M138 124 L148 128\" stroke=\"#F7931E\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M118 128 L112 142\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "help": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M30 120 Q60 100 96 112 L128 112 Q140 114 136 126 L106 128\" fill=\"#8D5524\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M170 92 Q140 74 104 86 L74 92 Q62 96 68 106 L96 104\" fill=\"#C68642\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M100 46 C 86 26, 60 44, 100 70 C 140 44, 114 26, 100 46Z\" fill=\"#E5484D\"/></svg>", "solved": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"14\" y=\"146\" width=\"172\" height=\"10\" rx=\"4\" fill=\"#c9dcef\"/><rect x=\"150\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"182\" y=\"60\" width=\"8\" height=\"90\" fill=\"#16324F\"/><rect x=\"161\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"167\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"173\" y=\"72\" width=\"3\" height=\"76\" fill=\"#3BB273\"/><rect x=\"30\" y=\"100\" width=\"40\" height=\"46\" rx=\"4\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"4\"/><g transform=\"translate(118,118) scale(1)\"><circle r=\"26\" fill=\"#F7931E\" stroke=\"#fff\" stroke-width=\"3\"/><circle cy=\"-1\" r=\"15\" fill=\"#8D5524\"/><path d=\"M-15 -3 Q0 -21 15 -3 Q0 -15 -15 -3Z\" fill=\"#1d1d1d\"/><circle cx=\"-4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><circle cx=\"4\" cy=\"0\" r=\"1.6\" fill=\"#1d1d1d\"/><path d=\"M-4 5 Q0 9 4 5\" stroke=\"#1d1d1d\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><circle cx=\"160\" cy=\"40\" r=\"20\" fill=\"#3BB273\"/><path d=\"M150 40 L158 48 L171 32\" stroke=\"#fff\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "shoelace": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><path d=\"M30 130 L40 80 L90 80 L104 108 L160 118 Q176 122 172 146 L30 146Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M30 146 L172 146 L172 156 L30 156Z\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M70 96 Q76 120 60 150 Q50 172 70 178 M84 98 Q100 130 120 166 Q126 178 140 176\" stroke=\"#fff\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M70 96 Q76 120 60 150 Q50 172 70 178 M84 98 Q100 130 120 166 Q126 178 140 176\" stroke=\"#16324F\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></svg>"};
const ROUNDS = [{"say": "Problem spotter! Is there a problem? Put each picture in the right group.", "bins": [{"name": "problem", "icon": "oops"}, {"name": "no problem", "icon": "fixed"}], "items": [["blocked", 0, "Ayo is stuck behind a box"], ["clearpath", 1, "Ayo walks to the gate"], ["spill", 0, "spilled water"], ["cupok", 1, "a full cup"]], "oops": "Look closely. Is something wrong?", "win": "Great spotting! The box and the spill are problems."}, {"say": "More problems to spot!", "bins": [{"name": "problem", "icon": "oops"}, {"name": "no problem", "icon": "fixed"}], "items": [["brokentoy", 0, "broken toy car"], ["toycar", 1, "toy car"], ["shoelace", 0, "shoelace undone"], ["shoes", 1, "shoes on"], ["doorshut", 0, "door shut, Ayo can\u2019t get in"], ["danger", 0, "danger sign"]], "oops": "Think: can we do what we want? Is it safe?", "win": "You found all the problems! Danger sign: stop, step back, tell a grown-up!"}, {"say": "Stretch! Ayo\u2019s box problem. Which pictures show a way to solve it?", "stretch": true, "bins": [{"name": "solves it", "icon": "solved"}, {"name": "still stuck", "icon": "blocked"}], "items": [["solved", 0, "go around the box"], ["help", 0, "ask a friend to help move it"], ["blocked", 1, "stand and wait"]], "oops": "Does it get Ayo to the gate?", "win": "Two ways to solve it: go around, or ask for help!"}];
let r=0, sel=null, left=0;
const $=id=>document.getElementById(id);
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function build(){
  const R=ROUNDS[r]; sel=null; left=R.items.length;
  $('round').textContent=`Round ${r+1} of ${ROUNDS.length}`+(R.stretch?' · Stretch':'');
  $('say').textContent=R.say; $('win').classList.remove('show');
  $('pool').innerHTML=shuffle(R.items).map((it,i)=>`<button class="card" data-k="${it[0]}" data-b="${it[1]}" aria-label="${it[2]||it[0]}">${ICONS[it[0]]}</button>`).join('');
  $('bins').style.gridTemplateColumns=`repeat(${Math.min(R.bins.length,2)},1fr)`;
  $('bins').innerHTML=R.bins.map((b,i)=>`<div class="bin" data-b="${i}"><div class="lab">${b.icon?ICONS[b.icon]:''}${b.name}</div><div class="in"></div></div>`).join('');
  document.querySelectorAll('.pool .card').forEach(c=>c.onclick=()=>{ document.querySelectorAll('.pool .card').forEach(x=>x.classList.remove('sel')); sel=c; c.classList.add('sel'); speak(c.getAttribute('aria-label')); });
  document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>drop(b));
  speak(R.say);
}
function drop(b){
  const R=ROUNDS[r]; if(!sel){ const t='First tap a picture.'; $('say').textContent=t; speak(t); return; }
  if(sel.dataset.b===b.dataset.b){
    b.querySelector('.in').insertAdjacentHTML('beforeend',ICONS[sel.dataset.k]); sel.remove(); sel=null; left--;
    if(left===0){ $('say').textContent='You did it!'; $('winsay').textContent=R.win; $('win').classList.add('show'); speak('You did it! '+R.win); $('next').textContent=r<ROUNDS.length-1?'Next ▶':'Play again ↻'; }
  } else {
    const t=R.oops||'Not that group. Think about the rule!'; $('say').textContent=t; speak(t);
    b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),500);
  }
}
$('next').onclick=()=>{ r=(r+1)%ROUNDS.length; build(); window.scrollTo({top:0,behavior:'smooth'}); };
$('speak').onclick=()=>speak($('say').textContent);
build();
</script>
</body>
