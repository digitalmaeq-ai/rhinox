<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 3 · Week 3</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found all the safe ways! Which picture means “yes, that’s the safe way”?</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Thumbs up! Safe way!</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>

e cx=\"10\" cy=\"20\" r=\"5\" fill=\"#16324F\"/><circle cx=\"34\" cy=\"20\" r=\"5\" fill=\"#16324F\"/></g><g transform=\"translate(112,90)\"><circle cy=\"-30\" r=\"14\" fill=\"#6B3F1A\"/><rect x=\"-14\" y=\"-14\" width=\"28\" height=\"44\" rx=\"8\" fill=\"#8E5BD9\"/><path d=\"M-6 30 L-7 58 M6 30 L7 58\" stroke=\"#16324F\" stroke-width=\"7\" stroke-linecap=\"round\"/></g><g transform=\"translate(92,98) scale(0.9)\"><circle cy=\"-14\" r=\"13\" fill=\"#8D5524\"/><path d=\"M-13 -18 Q0 -34 13 -18 Q0 -28 -13 -18Z\" fill=\"#1d1d1d\"/><rect x=\"-11\" y=\"0\" width=\"22\" height=\"28\" rx=\"6\" fill=\"#F7931E\"/><path d=\"M-5 26 L-6 48 M5 26 L6 48\" stroke=\"#16324F\" stroke-width=\"6\" stroke-linecap=\"round\"/></g><path d=\"M100 92 L108 86\" stroke=\"#8D5524\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "busyroad": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><rect x=\"10\" y=\"96\" width=\"180\" height=\"56\" fill=\"#5b6b7a\"/><path d=\"M10 124 L190 124\" stroke=\"#FFC93C\" stroke-width=\"4\" stroke-dasharray=\"14 10\"/><g transform=\"translate(20,104)\"><rect x=\"0\" y=\"0\" width=\"44\" height=\"18\" rx=\"5\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"8\" y=\"-10\" width=\"26\" height=\"12\" rx=\"3\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"10\" cy=\"20\" r=\"5\" fill=\"#16324F\"/><circle cx=\"34\" cy=\"20\" r=\"5\" fill=\"#16324F\"/></g><g transform=\"translate(130,130)\"><rect x=\"0\" y=\"0\" width=\"44\" height=\"18\" rx=\"5\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"8\" y=\"-10\" width=\"26\" height=\"12\" rx=\"3\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"10\" cy=\"20\" r=\"5\" fill=\"#16324F\"/><circle cx=\"34\" cy=\"20\" r=\"5\" fill=\"#16324F\"/></g><g transform=\"translate(100,108) scale(0.9)\"><circle cy=\"-14\" r=\"13\" fill=\"#8D5524\"/><path d=\"M-13 -18 Q0 -34 13 -18 Q0 -28 -13 -18Z\" fill=\"#1d1d1d\"/><rect x=\"-11\" y=\"0\" width=\"22\" height=\"28\" rx=\"6\" fill=\"#F7931E\"/><path d=\"M-6 26 L-14 46 M6 26 L16 44\" stroke=\"#16324F\" stroke-width=\"6\" stroke-linecap=\"round\"/></g></svg>", "route_busy": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><rect x=\"30\" y=\"30\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"65\" y=\"30\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"100\" y=\"30\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"135\" y=\"30\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"30\" y=\"65\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"65\" y=\"65\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"100\" y=\"65\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"135\" y=\"65\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"30\" y=\"100\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"65\" y=\"100\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"100\" y=\"100\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"135\" y=\"100\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"30\" y=\"135\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"65\" y=\"135\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"100\" y=\"135\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"135\" y=\"135\" width=\"35\" height=\"35\" fill=\"#fff\" stroke=\"#c9dcef\" stroke-width=\"2\"/><rect x=\"30\" y=\"100\" width=\"140\" height=\"35\" fill=\"#5b6b7a\" opacity=\".8\"/><g transform=\"translate(60,108)\"><rect x=\"0\" y=\"0\" width=\"44\" height=\"18\" rx=\"5\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"8\" y=\"-10\" width=\"26\" height=\"12\" rx=\"3\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"10\" cy=\"20\" r=\"5\" fill=\"#16324F\"/><circle cx=\"34\" cy=\"20\" r=\"5\" fill=\"#16324F\"/></g><path d=\"M47 47 L47 152 L152 152\" stroke=\"#168fe5\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"138\" y=\"140\" width=\"28\" height=\"24\" fill=\"#C8955C\" stroke=\"#16324F\" stroke-width=\"3\"/></svg>", "chairstand": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M70 110 L130 110 L130 120 L70 120Z M74 120 L74 166 M126 120 L126 166 M74 110 L74 60 L126 60 L126 110\" stroke=\"#8a5a2b\" stroke-width=\"7\" fill=\"none\" stroke-linejoin=\"round\"/><g transform=\"translate(100,66) scale(1.0)\"><circle cy=\"-14\" r=\"13\" fill=\"#8D5524\"/><path d=\"M-13 -18 Q0 -34 13 -18 Q0 -28 -13 -18Z\" fill=\"#1d1d1d\"/><rect x=\"-11\" y=\"0\" width=\"22\" height=\"28\" rx=\"6\" fill=\"#168fe5\"/><path d=\"M-5 26 L-6 48 M5 26 L6 48\" stroke=\"#16324F\" stroke-width=\"6\" stroke-linecap=\"round\"/></g></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>", "danger": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><path d=\"M100 30 L176 160 L24 160Z\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"7\" stroke-linejoin=\"round\"/><rect x=\"92\" y=\"70\" width=\"16\" height=\"52\" rx=\"6\" fill=\"#16324F\"/><circle cx=\"100\" cy=\"140\" r=\"9\" fill=\"#16324F\"/></svg>", "chairsit": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M70 110 L130 110 L130 120 L70 120Z M74 120 L74 166 M126 120 L126 166 M74 110 L74 60 L126 60 L126 110\" stroke=\"#8a5a2b\" stroke-width=\"7\" fill=\"none\" stroke-linejoin=\"round\"/><g transform=\"translate(100,72)\"><circle cy=\"-6\" r=\"13\" fill=\"#8D5524\"/><rect x=\"-12\" y=\"8\" width=\"24\" height=\"30\" rx=\"6\" fill=\"#168fe5\"/><path d=\"M-6 38 L-24 40 L-24 66 M6 38 L-8 42 L-8 66\" stroke=\"#16324F\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>"};
const CFG = {"names": {"zebracross": "zebra crossing", "holdhand": "hold a grown-up\u2019s hand", "chairsit": "sit on the chair", "route_safe": "safe route"}, "answer": "thumbsup", "choices": ["danger", "thumbsup", "busyroad"], "ask": "You found all the safe ways! Which picture means \u201cyes, that\u2019s the safe way\u201d?", "yes": "Thumbs up! Safe way!", "no": "That one is not it. Find the thumbs-up."}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
