<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase Run</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--bg:#F4F9FF;--card:#fff;--ink:#16324F}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--blue);color:var(--navy);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0 8px;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #d8e8f8}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);color:var(--navy);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.round{font-weight:800;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);margin:18px 0}
.slot{aspect-ratio:1/1.1;border:4px dashed #9cc9f0;border-radius:24px;background:#fff;position:relative;display:grid;place-items:center;cursor:pointer}
.slot .num{position:absolute;top:8px;left:12px;font-size:clamp(22px,5vw,34px);font-weight:900;color:var(--blue)}
.slot .lbl{position:absolute;bottom:6px;width:100%;text-align:center;font-weight:800;font-size:clamp(13px,2.6vw,18px);color:#5b7a98}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot svg,.card svg{width:78%;height:auto}
.arrows{display:flex;justify-content:space-around;margin-top:-10px;color:var(--blue);font-size:28px;font-weight:900}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);min-height:120px;margin-top:6px}
.card{border:0;padding:6px;background:var(--card);border-radius:22px;box-shadow:0 6px 0 #c9dcef;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 #c9dcef}
.card.gone{visibility:hidden}
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:6px auto 0;opacity:.95}
.model div{background:#fff;border-radius:16px;padding:4px;border:3px solid var(--orange);position:relative}
.model div b{position:absolute;top:2px;left:8px;color:var(--orange);font-weight:900}
.model svg{width:100%;height:auto;display:block}
.bar{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57}
.btn.alt{background:#fff;color:var(--navy);box-shadow:0 5px 0 #c9dcef}
.btn[disabled]{opacity:.45;cursor:default}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{display:none;text-align:center;padding:10px}
.win.show{display:block}
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .6s backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.note{font-size:12px;color:#5b7a98;text-align:center;margin-top:18px}

.road{display:grid;gap:8px;margin:14px 0 4px}
.cell{aspect-ratio:1;border-radius:16px;background:#fff;border:4px solid #c9dcef;display:grid;place-items:center;position:relative;font-weight:900;color:#9cc9f0;font-size:20px}
.cell.gate{border-color:var(--green);background:#EAF8EF}
.cell svg{width:86%;height:auto}
.token{position:absolute;inset:6%;transition:transform .5s}
.token svg{width:100%;height:100%}
.feet{color:#9cc9f0}
.run{background:var(--blue);box-shadow:0 5px 0 #0f6db0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 3 · Week 13</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <div><div class="round" id="round"></div><p class="say" id="say"></p></div>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>
  <div class="road" id="road"></div>
  <p style="text-align:center;font-weight:800;color:#5b7a98;margin:6px 0">1 · Plan your cards &nbsp; 2 · Run! &nbsp; 3 · Fix if needed</p>
  <div class="slots" id="slots"></div>
  <div class="tray" id="tray"></div>
  <div class="bar">
    <button class="btn alt" id="undo">↩ Undo</button>
    <button class="btn run" id="go" disabled>▶ Run</button>
  </div>
  <div class="win" id="win">
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <p class="say" id="winsay"></p>
    <div class="bar"><button class="btn" id="next">Next ▶</button></div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>

F\"/><circle cx=\"150\" cy=\"140\" r=\"75\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.5\" stroke-dasharray=\"3 7\"/><defs><path id=\"bt\" d=\"M 92 140 A 58 58 0 0 1 208 140\"/></defs><text font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"19\" fill=\"#ffffff\" letter-spacing=\"2\"><textPath href=\"#bt\" startOffset=\"50%\" text-anchor=\"middle\">STEP THINKER</textPath></text><circle cx=\"111\" cy=\"152\" r=\"11\" fill=\"#F7931E\"/><rect x=\"126\" y=\"141\" width=\"22\" height=\"22\" rx=\"3\" fill=\"#3BB273\"/><circle cx=\"163\" cy=\"152\" r=\"11\" fill=\"#F7931E\"/><rect x=\"178\" y=\"141\" width=\"22\" height=\"22\" rx=\"3\" fill=\"#3BB273\"/><text x=\"150\" y=\"196\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"15\" fill=\"#FFC93C\">TERM 2</text><rect x=\"45\" y=\"248\" width=\"210\" height=\"32\" rx=\"9\" fill=\"#16324F\"/><text x=\"150\" y=\"271\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"700\" font-size=\"13\" fill=\"#fff\">Nursery 1 \u00b7 Think \u2022 Move \u2022 Code!</text></svg>"};
const ROUNDS = [{"say": "Showcase time! Show your family Ayo\u2019s route to your ramp.", "target": "ramp", "gate": 2, "slots": 3, "tray": ["forward", "forward", "stop", "wave"], "order": ["forward", "forward", "stop"], "labels": {"forward": "forward", "stop": "stop", "wave": "wave"}, "win": "Forward, forward, stop. Well done, Step Thinker!"}, {"say": "Now a longer route! The ramp is 3 squares away. Can you use do it again?", "target": "ramp", "gate": 3, "slots": 4, "tray": ["forward", "again", "again", "stop", "wave"], "order": ["forward", "again", "again", "stop"], "labels": {"forward": "forward", "again": "do it again", "stop": "stop", "wave": "wave"}, "win": "Forward, again, again, stop. You are a Step Thinker for Nursery 1!"}];
let r=0, placed=[], running=false;
const $=id=>document.getElementById(id);
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function road(pos){
  const R=ROUNDS[r], n=R.gate+1;
  $('road').style.gridTemplateColumns=`repeat(${n},1fr)`;
  $('road').innerHTML=Array.from({length:n},(_,i)=>`<div class="cell ${i===R.gate?'gate':''}">${i===R.gate?ICONS[R.target||'schoolgate']:(i===0?'start':'<span class=feet>👣</span>')}${i===pos?`<div class="token">${ICONS.ayotoken}</div>`:''}</div>`).join('');
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function build(){
  const R=ROUNDS[r]; placed=[]; running=false;
  $('round').textContent=`Round ${r+1} of ${ROUNDS.length}`+(R.stretch?' · Stretch':'');
  $('say').textContent=R.say; $('win').classList.remove('show'); road(0);
  $('slots').style.gridTemplateColumns=`repeat(${R.slots},1fr)`;
  $('slots').innerHTML=Array.from({length:R.slots},(_,i)=>`<div class="slot" data-i="${i}"><span class="num">${i+1}</span></div>`).join('');
  $('tray').style.gridTemplateColumns=`repeat(${R.tray.length},1fr)`;
  $('tray').innerHTML=shuffle(R.tray).map(k=>`<button class="card" data-k="${k}" aria-label="${R.labels[k]}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{ if(running||placed.length>=R.slots) return; placed.push(c.dataset.k); c.classList.add('gone'); speak(R.labels[c.dataset.k]); sync(); });
  sync(); speak(R.say);
}
function sync(){
  document.querySelectorAll('.slot').forEach((s,i)=>{ const k=placed[i]; s.classList.toggle('filled',!!k); s.querySelectorAll('svg').forEach(x=>x.remove()); if(k) s.insertAdjacentHTML('beforeend',ICONS[k]); });
  $('go').disabled = placed.length<ROUNDS[r].slots || running;
}
$('undo').onclick=()=>{ if(running) return; const k=placed.pop(); if(!k) return; document.querySelector(`.card.gone[data-k="${k}"]`).classList.remove('gone'); road(0); sync(); };
const wait=ms=>new Promise(res=>setTimeout(res,ms));
$('go').onclick=async()=>{
  const R=ROUNDS[r]; running=true; sync(); let pos=0, last=null, stopped=false;
  road(0); await wait(300);
  for(let i=0;i<placed.length;i++){
    const k=placed[i]; const slot=document.querySelector(`.slot[data-i="${i}"]`); slot.classList.add('pick');
    let act = k==='again' ? last : k; speak(R.labels[k]);
    if(act==='forward'){ pos=Math.min(pos+1,R.gate+1); road(Math.min(pos,R.gate)); }
    if(k!=='again') last=k;
    if(k==='stop'){ stopped=true; await wait(700); slot.classList.remove('pick'); break; }
    await wait(800); slot.classList.remove('pick');
  }
  running=false; sync();
  if(stopped && pos===R.gate){
    $('say').textContent='You did it!'; $('winsay').textContent=R.win; $('win').classList.add('show'); speak('You did it! '+R.win);
    $('next').textContent = r<ROUNDS.length-1?'Next ▶':'Play again ↻';
  } else {
    const t = pos>R.gate ? 'Oh no, Ayo walked past the gate! Fix a card.' : !stopped ? 'Ayo did not stop! Add a stop card.' : 'Ayo stopped too soon. Fix a card and run again.';
    $('say').textContent=t; speak(t); $('road').classList.add('shake'); setTimeout(()=>$('road').classList.remove('shake'),500);
  }
};
$('next').onclick=()=>{ r=(r+1)%ROUNDS.length; build(); window.scrollTo({top:0,behavior:'smooth'}); };
$('speak').onclick=()=>speak($('say').textContent);
build();
</script>
