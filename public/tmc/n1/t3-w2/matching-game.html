<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Term 3 · Week 2</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found them all! Which is the FIRST small step of going to the shop?</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Yes! First Ayo leaves home!</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>

\"159\" cy=\"54\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M141 62 Q150 74 159 62\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "bigjob": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><rect x=\"22\" y=\"56\" width=\"70\" height=\"90\" rx=\"6\" fill=\"#8E5BD9\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M100 100 L120 100\" stroke=\"#16324F\" stroke-width=\"6\"/><path d=\"M114 90 L126 100 L114 110\" fill=\"none\" stroke=\"#16324F\" stroke-width=\"6\"/><rect x=\"134\" y=\"44\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#F7931E\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"134\" y=\"86\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"134\" y=\"128\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\"/><text x=\"154\" y=\"66\" font-family=\"Arial\" font-weight=\"900\" font-size=\"18\" text-anchor=\"middle\" fill=\"#fff\">1</text><text x=\"154\" y=\"108\" font-family=\"Arial\" font-weight=\"900\" font-size=\"18\" text-anchor=\"middle\" fill=\"#fff\">2</text><text x=\"154\" y=\"150\" font-family=\"Arial\" font-weight=\"900\" font-size=\"18\" text-anchor=\"middle\" fill=\"#fff\">3</text></svg>", "matflat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><path d=\"M30 120 L170 120 L150 160 L50 160Z\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M60 128 L140 128 M56 140 L144 140 M52 152 L148 152\" stroke=\"#FFC93C\" stroke-width=\"4\"/></svg>", "jug": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><path d=\"M60 70 L120 70 L126 150 L54 150Z\" fill=\"#BFE3FF\" stroke=\"#16324F\" stroke-width=\"5\" stroke-linejoin=\"round\"/><path d=\"M120 86 Q150 96 124 126\" stroke=\"#16324F\" stroke-width=\"6\" fill=\"none\"/><path d=\"M60 70 L48 60\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"76\" cy=\"128\" r=\"11\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"100\" cy=\"130\" r=\"11\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"88\" cy=\"108\" r=\"11\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"3\"/></svg>", "pay": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><rect x=\"30\" y=\"70\" width=\"110\" height=\"60\" rx=\"8\" fill=\"#9ED9A6\" stroke=\"#16324F\" stroke-width=\"5\" transform=\"rotate(-8 85 100)\"/><circle cx=\"85\" cy=\"100\" r=\"16\" fill=\"none\" stroke=\"#2f7d3b\" stroke-width=\"5\" transform=\"rotate(-8 85 100)\"/><circle cx=\"146\" cy=\"124\" r=\"24\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"160\" cy=\"98\" r=\"20\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"5\"/><path d=\"M60 160 Q100 142 150 160\" stroke=\"#8D5524\" stroke-width=\"14\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "market": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M24 50 L176 50 L166 82 L34 82 Z\" fill=\"#3BB273\"/><path d=\"M44 50 L63 50 L61 82 L46 82Z\" fill=\"#ffffff\"/><path d=\"M82 50 L101 50 L99 82 L84 82Z\" fill=\"#ffffff\"/><path d=\"M120 50 L139 50 L137 82 L122 82Z\" fill=\"#ffffff\"/><rect x=\"34\" y=\"82\" width=\"6\" height=\"90\" fill=\"#B5651D\"/><rect x=\"160\" y=\"82\" width=\"6\" height=\"90\" fill=\"#B5651D\"/><rect x=\"30\" y=\"128\" width=\"140\" height=\"14\" rx=\"4\" fill=\"#B5651D\"/><ellipse cx=\"64\" cy=\"120\" rx=\"16\" ry=\"11\" fill=\"#D9A066\" stroke=\"#8a5a2b\" stroke-width=\"3\"/><ellipse cx=\"100\" cy=\"120\" rx=\"16\" ry=\"11\" fill=\"#D9A066\" stroke=\"#8a5a2b\" stroke-width=\"3\"/><ellipse cx=\"136\" cy=\"120\" rx=\"16\" ry=\"11\" fill=\"#D9A066\" stroke=\"#8a5a2b\" stroke-width=\"3\"/></svg>", "matrolled": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><rect x=\"40\" y=\"96\" width=\"120\" height=\"44\" rx=\"22\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"5\"/><ellipse cx=\"150\" cy=\"118\" rx=\"12\" ry=\"22\" fill=\"#c43a3e\" stroke=\"#16324F\" stroke-width=\"4\"/><path d=\"M150 108 A8 8 0 1 1 144 120\" stroke=\"#FFC93C\" stroke-width=\"3\" fill=\"none\"/></svg>", "platedirty": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FDECEC\"/><ellipse cx=\"100\" cy=\"118\" rx=\"58\" ry=\"30\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"5\"/><ellipse cx=\"100\" cy=\"114\" rx=\"34\" ry=\"16\" fill=\"none\" stroke=\"#c9dcef\" stroke-width=\"4\"/><circle cx=\"86\" cy=\"110\" r=\"7\" fill=\"#C8955C\"/><circle cx=\"110\" cy=\"118\" r=\"5\" fill=\"#E5484D\"/><circle cx=\"100\" cy=\"106\" r=\"4\" fill=\"#3BB273\"/></svg>", "bowlfull": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><path d=\"M36 100 L164 100 Q160 160 100 164 Q40 160 36 100Z\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"5\"/><circle cx=\"70\" cy=\"92\" r=\"11\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"96\" cy=\"88\" r=\"11\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"122\" cy=\"92\" r=\"11\" fill=\"#FFC93C\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"84\" cy=\"74\" r=\"11\" fill=\"#3BB273\" stroke=\"#16324F\" stroke-width=\"3\"/><circle cx=\"110\" cy=\"72\" r=\"11\" fill=\"#E5484D\" stroke=\"#16324F\" stroke-width=\"3\"/></svg>", "platewash": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F1FC\"/><ellipse cx=\"100\" cy=\"118\" rx=\"58\" ry=\"30\" fill=\"#fff\" stroke=\"#16324F\" stroke-width=\"5\"/><ellipse cx=\"100\" cy=\"114\" rx=\"34\" ry=\"16\" fill=\"none\" stroke=\"#c9dcef\" stroke-width=\"4\"/><circle cx=\"70\" cy=\"80\" r=\"10\" fill=\"#fff\" stroke=\"#7cc4ff\" stroke-width=\"3\"/><circle cx=\"92\" cy=\"66\" r=\"8\" fill=\"#fff\" stroke=\"#7cc4ff\" stroke-width=\"3\"/><circle cx=\"118\" cy=\"76\" r=\"12\" fill=\"#fff\" stroke=\"#7cc4ff\" stroke-width=\"3\"/><path d=\"M140 70 L160 50\" stroke=\"#FFC93C\" stroke-width=\"14\" stroke-linecap=\"round\"/></svg>", "qmark": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"#ffffff\" stroke=\"#F7931E\" stroke-width=\"6\" stroke-dasharray=\"10 8\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Inter, Arial\" font-weight=\"800\" font-size=\"84\" fill=\"#F7931E\">?</text></svg>"};
const CFG = {"names": {"leavehome": "leave home", "market": "buy bread", "comehome": "go home", "pay": "pay"}, "answer": "leavehome", "choices": ["comehome", "leavehome", "market"], "ask": "You found them all! Which is the FIRST small step of going to the shop?", "yes": "Yes! First Ayo leaves home!", "no": "Hmm, that comes later. What does Ayo do first?"}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>

</html>
