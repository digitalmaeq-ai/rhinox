<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Pairs</title>
<style>
:root{--blue:#168fe5;--navy:#16324F;--orange:#F7931E;--green:#3BB273;--yellow:#FFC93C;--purple:#8E5BD9;--bg:#F7F3FF}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--navy);-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:15px}
.tag{font-size:12px;background:#fff;border:2px dashed var(--purple);border-radius:999px;padding:4px 12px}
.bubble{margin:16px 0;background:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 0 #e2d8f6}
.bot{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;text-align:center;line-height:1.05}
.say{font-size:clamp(20px,4.2vw,28px);font-weight:800;margin:0}
.speak{margin-left:auto;border:0;background:var(--yellow);font-size:28px;width:60px;height:60px;border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #d9a91e}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.4vw,18px)}
.tile{aspect-ratio:1;border:0;padding:0;background:transparent;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.tile.open .inner,.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(22,50,79,.15)}
.back{background:var(--purple);color:#fff;font-size:clamp(40px,10vw,64px);font-weight:900}
.back::after{content:"?"}
.front{background:#fff;transform:rotateY(180deg)}
.front svg{width:86%;height:auto}
.tile.done .front{outline:5px solid var(--green)}
.tile.pick .front{outline:5px solid var(--orange)}
.final{display:none;text-align:center;margin-top:18px}
.final.show{display:block}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:12px auto}
.choice{border:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 0 #d8cdef;cursor:pointer}
.choice svg{width:100%;height:auto;display:block}
.stars{font-size:54px;letter-spacing:6px}
.btn{border:0;border-radius:999px;padding:16px 28px;font-size:20px;font-weight:900;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 5px 0 #2a8a57;margin-top:10px}
.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.note{font-size:12px;color:#6f6290;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Think • Move • Code! · Nursery 1 · Week 5</div>
    <div class="tag">Optional · just for fun · not a test</div>
  </div>
  <div class="bubble">
    <div class="bot">Rhino<br>Bot</div>
    <p class="say" id="say">Find the pairs! Tap two cards.</p>
    <button class="speak" id="speak" aria-label="Read aloud">🔊</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="final" id="final">
    <p class="say" id="q">You found them all! Now tap what Ayo puts on first.</p>
    <div class="choices" id="choices"></div>
    <div id="done" hidden>
      <div class="stars">⭐⭐⭐</div>
      <p class="say">Yes! Socks first, then shoes!</p>
      <button class="btn" id="again">Play again ↻</button>
    </div>
  </div>
  <p class="note">Works offline once loaded.</p>
</div>
<script>
const ICONS = {"socks": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#F1E9FF\"/><path d=\"M70 40 L100 40 L100 102 Q100 126 78 130 L48 130 Q30 128 32 114 Q36 102 64 102 L70 102 Z\" fill=\"#8E5BD9\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"70\" y=\"40\" width=\"30\" height=\"12\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"70\" y=\"70\" width=\"30\" height=\"8\" fill=\"#ffffff\" opacity=\".7\"/><path d=\"M128 52 L158 52 L158 114 Q158 138 136 142 L106 142 Q88 140 90 126 Q94 114 122 114 L128 114 Z\" fill=\"#8E5BD9\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"128\" y=\"52\" width=\"30\" height=\"12\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><rect x=\"128\" y=\"82\" width=\"30\" height=\"8\" fill=\"#ffffff\" opacity=\".7\"/></svg>", "shoes": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><path d=\"M32 52 L66 52 L72 78 Q106 84 108 104 L108 112 L28 112 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"26\" y=\"108\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M40 66 L62 62 M40 76 L64 72\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M96 100 L130 100 L136 126 Q170 132 172 152 L172 160 L92 160 Z\" fill=\"#168fe5\" stroke=\"#16324F\" stroke-width=\"4\" stroke-linejoin=\"round\"/><rect x=\"90\" y=\"156\" width=\"84\" height=\"10\" rx=\"5\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"3\"/><path d=\"M104 114 L126 110 M104 124 L128 120\" stroke=\"#ffffff\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "walk": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><circle cx=\"96\" cy=\"48\" r=\"20\" fill=\"#8D5524\"/><path d=\"M78 42 Q96 14 114 42 Q96 30 78 42Z\" fill=\"#1d1d1d\"/><circle cx=\"87\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"105\" cy=\"50\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M87 60 Q96 68 105 60\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"80\" y=\"68\" width=\"32\" height=\"44\" rx=\"12\" fill=\"#F7931E\"/><path d=\"M86 108 L70 150\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M104 108 L122 148\" stroke=\"#16324F\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M82 76 L62 100\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M110 76 L130 96\" stroke=\"#8D5524\" stroke-width=\"9\" stroke-linecap=\"round\"/><ellipse cx=\"146\" cy=\"172\" rx=\"7\" ry=\"11\" fill=\"#3BB273\" opacity=\".7\" transform=\"rotate(90 146 172)\"/><ellipse cx=\"172\" cy=\"160\" rx=\"7\" ry=\"11\" fill=\"#3BB273\" opacity=\".7\" transform=\"rotate(90 172 160)\"/><path d=\"M140 120 L176 120 M164 108 L178 120 L164 132\" stroke=\"#3BB273\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "wake": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#FFF4D6\"/><circle cx=\"160\" cy=\"44\" r=\"18\" fill=\"#FFC93C\"/><line x1=\"160\" y1=\"44\" x2=\"190\" y2=\"44\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"44\" x2=\"130\" y2=\"44\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"44\" x2=\"160\" y2=\"74\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"44\" x2=\"160\" y2=\"14\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"44\" x2=\"181.0\" y2=\"65.0\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"44\" x2=\"139.0\" y2=\"65.0\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"44\" x2=\"181.0\" y2=\"23.0\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"160\" y1=\"44\" x2=\"139.0\" y2=\"23.0\" stroke=\"#FFC93C\" stroke-width=\"5\" stroke-linecap=\"round\"/><rect x=\"22\" y=\"120\" width=\"156\" height=\"34\" rx=\"8\" fill=\"#168fe5\"/><rect x=\"22\" y=\"96\" width=\"16\" height=\"78\" rx=\"6\" fill=\"#16324F\"/><rect x=\"162\" y=\"112\" width=\"16\" height=\"62\" rx=\"6\" fill=\"#16324F\"/><rect x=\"40\" y=\"104\" width=\"34\" height=\"18\" rx=\"8\" fill=\"#ffffff\"/><rect x=\"78\" y=\"96\" width=\"44\" height=\"40\" rx=\"14\" fill=\"#F7931E\"/><circle cx=\"100\" cy=\"78\" r=\"22\" fill=\"#8D5524\"/><path d=\"M80 72 Q100 42 120 72 Q100 58 80 72Z\" fill=\"#1d1d1d\"/><circle cx=\"91\" cy=\"80\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"109\" cy=\"80\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M91 90 Q100 98 109 90\" stroke=\"#1d1d1d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M80 104 L58 70\" stroke=\"#F7931E\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M120 104 L142 70\" stroke=\"#F7931E\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"57\" cy=\"66\" r=\"7\" fill=\"#8D5524\"/><circle cx=\"143\" cy=\"66\" r=\"7\" fill=\"#8D5524\"/><rect x=\"60\" y=\"118\" width=\"110\" height=\"20\" rx=\"8\" fill=\"#ffffff\" opacity=\".9\"/></svg>", "brush": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E3F3FF\"/><circle cx=\"96\" cy=\"96\" r=\"46\" fill=\"#8D5524\"/><path d=\"M52 90 Q96 36 140 90 Q96 52 52 90Z\" fill=\"#1d1d1d\"/><circle cx=\"87\" cy=\"98\" r=\"3.4\" fill=\"#1d1d1d\"/><circle cx=\"105\" cy=\"98\" r=\"3.4\" fill=\"#1d1d1d\"/><path d=\"M87 108 Q96 116 105 108\" stroke=\"#1d1d1d\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"80\" y=\"104\" width=\"34\" height=\"12\" rx=\"6\" fill=\"#ffffff\" stroke=\"#1d1d1d\" stroke-width=\"2\"/><rect x=\"110\" y=\"104\" width=\"70\" height=\"12\" rx=\"6\" fill=\"#168fe5\"/><rect x=\"96\" y=\"98\" width=\"20\" height=\"8\" rx=\"3\" fill=\"#ffffff\" stroke=\"#168fe5\" stroke-width=\"2\"/><circle cx=\"62\" cy=\"128\" r=\"8\" fill=\"#DFF3FF\" stroke=\"#168fe5\" stroke-width=\"2\"/><circle cx=\"48\" cy=\"112\" r=\"6\" fill=\"#DFF3FF\" stroke=\"#168fe5\" stroke-width=\"2\"/><circle cx=\"56\" cy=\"146\" r=\"5\" fill=\"#DFF3FF\" stroke=\"#168fe5\" stroke-width=\"2\"/><rect x=\"58\" y=\"150\" width=\"76\" height=\"40\" rx=\"18\" fill=\"#F7931E\"/></svg>", "eat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"28\" fill=\"#E6F7EE\"/><ellipse cx=\"100\" cy=\"130\" rx=\"74\" ry=\"40\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"4\"/><ellipse cx=\"100\" cy=\"128\" rx=\"50\" ry=\"25\" fill=\"#F3F7FB\"/><ellipse cx=\"86\" cy=\"126\" rx=\"26\" ry=\"16\" fill=\"#ffffff\" stroke=\"#e6e6e6\" stroke-width=\"2\"/><circle cx=\"86\" cy=\"126\" r=\"9\" fill=\"#FFC93C\"/><rect x=\"108\" y=\"118\" width=\"34\" height=\"18\" rx=\"6\" fill=\"#D9A066\"/><rect x=\"112\" y=\"122\" width=\"26\" height=\"4\" rx=\"2\" fill=\"#B97D40\"/><rect x=\"150\" y=\"40\" width=\"30\" height=\"44\" rx=\"6\" fill=\"#ffffff\" stroke=\"#16324F\" stroke-width=\"4\"/><rect x=\"154\" y=\"58\" width=\"22\" height=\"22\" fill=\"#F7931E\" opacity=\".85\"/><ellipse cx=\"42\" cy=\"70\" rx=\"10\" ry=\"14\" fill=\"#cfd8e3\"/><rect x=\"38\" y=\"80\" width=\"8\" height=\"40\" rx=\"4\" fill=\"#cfd8e3\"/></svg>"};
const CFG = {"names": {"socks": "socks", "shoes": "shoes", "walk": "walk"}, "answer": "socks", "ask": "You found them all! Now tap what Ayo puts on first.", "yes": "Yes! Socks first, then shoes!", "no": "Oops, that is Silly Ayo\u2019s mistake! What goes on first?"}; const NAMES = CFG.names;
const $ = id => document.getElementById(id);
let open = [], lock = false, found = 0;
function speak(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function start(){
  open=[]; lock=false; found=0;
  $('final').classList.remove('show'); $('done').hidden=true; $('grid').hidden=false;
  $('say').textContent='Find the pairs! Tap two cards.';
  const deck = shuffle(Object.keys(NAMES).flatMap(k=>[k,k]));
  $('grid').innerHTML = deck.map((k,i)=>`<button class="tile" data-k="${k}" aria-label="card ${i+1}"><div class="inner"><div class="face back"></div><div class="face front">${ICONS[k]}</div></div></button>`).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(t));
  speak('Find the pairs! Tap two cards.');
}
function flip(t){
  if(lock || t.classList.contains('open') || t.classList.contains('done')) return;
  t.classList.add('open'); speak(NAMES[t.dataset.k]); open.push(t);
  if(open.length<2) return;
  lock = true;
  const [a,b] = open;
  if(a.dataset.k===b.dataset.k){
    setTimeout(()=>{ a.classList.replace('open','done'); b.classList.replace('open','done'); open=[]; lock=false; found++;
      speak('A pair! '+NAMES[a.dataset.k]);
      if(found===Object.keys(NAMES).length) setTimeout(finale, 900);
    }, 500);
  } else {
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); open=[]; lock=false; }, 1100);
  }
}
function finale(){
  $('grid').hidden = true; $('final').classList.add('show');
  $('say').textContent = 'Great matching!';
  $('choices').innerHTML = shuffle(CFG.choices || Object.keys(NAMES)).map(k=>`<button class="choice" data-k="${k}" aria-label="${NAMES[k]||k}">${ICONS[k]}</button>`).join('');
  document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{
    if(c.dataset.k===CFG.answer){ $('done').hidden=false; speak(CFG.yes); }
    else { c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),500); speak(CFG.no); }
  });
  speak(CFG.ask);
}
$('again').onclick = start;
$('speak').onclick = ()=>speak($('final').classList.contains('show') ? $('q').textContent : $('say').textContent);
start();
</script>
</body>
</html>
