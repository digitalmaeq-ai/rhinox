<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Glass body: thicker/tinted at the edges, clear in the middle -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aab6be" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#e4e9ec" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.86" stop-color="#e4e9ec" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9aa7b0" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Glass edge -->
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a8892"/>
      <stop offset="0.5" stop-color="#d0d8de"/>
      <stop offset="1" stop-color="#6f7d88"/>
    </linearGradient>
    <!-- Liquid: rounded volume -->
    <linearGradient id="liquidH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c6ce" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#e3eaee" stop-opacity="0.3"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.75" stop-color="#e3eaee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#aebcc5" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="liquidV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#001a33" stop-opacity="0"/>
      <stop offset="1" stop-color="#5d6c77" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Specular highlight fades -->
    <linearGradient id="specV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="specBulb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Bottom caustic and floor shadow -->
    <radialGradient id="caustic" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b2236" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0b2236" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Floor shadow -->
  <ellipse cx="256" cy="452" rx="138" ry="13" fill="url(#shadow)"/>

  <!-- Calibration ring (back half, seen through the glass) -->
  <path d="M236 141 A20 4 0 0 1 276 141" fill="none" stroke="#7b8892" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Glass body -->
  <path d="M236 70 V246 C236 262 146 282 146 362 C146 410 162 444 204 444 H308 C350 444 366 410 366 362 C366 282 276 262 276 246 V70 Z" fill="url(#glassFill)"/>

  <!-- Liquid with concave meniscus resting on the mark -->
  <path d="M243 136 Q256 146 269 136 V250 C269 268 358 288 358 362 C358 404 344 436 308 436 H204 C168 436 154 404 154 362 C154 288 243 268 243 250 Z" fill="url(#liquidH)"/>
  <path d="M243 136 Q256 146 269 136 V250 C269 268 358 288 358 362 C358 404 344 436 308 436 H204 C168 436 154 404 154 362 C154 288 243 268 243 250 Z" fill="url(#liquidV)"/>
  <path d="M243 136 Q256 146 269 136" fill="none" stroke="#5f6d78" stroke-width="2.5" stroke-opacity="0.85"/>
  <path d="M244 140 Q256 149 268 140" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>

  <!-- Light focused through the base -->
  <ellipse cx="256" cy="426" rx="78" ry="9" fill="url(#caustic)"/>

  <!-- Etched markings -->
  <text x="256" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#55636e" fill-opacity="0.75">250 mL</text>
  <text x="256" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#55636e" fill-opacity="0.6">20°C  ±0.15</text>

  <!-- Bubbles -->
  <g fill="#ffffff" fill-opacity="0.12" stroke="#8d9aa4" stroke-opacity="0.7" stroke-width="1.5">
    <circle cx="218" cy="350" r="6"/>
    <circle cx="300" cy="330" r="4"/>
    <circle cx="256" cy="300" r="3"/>
    <circle cx="322" cy="410" r="5"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="216" cy="348" r="1.6"/>
    <circle cx="299" cy="329" r="1.2"/>
    <circle cx="320" cy="408" r="1.4"/>
  </g>

  <!-- Calibration ring (front half, etched) -->
  <path d="M236 141 A20 4 0 0 0 276 141" fill="none" stroke="#55636e" stroke-opacity="0.9" stroke-width="2.5"/>

  <!-- Glass edge -->
  <path d="M236 70 V246 C236 262 146 282 146 362 C146 410 162 444 204 444 H308 C350 444 366 410 366 362 C366 282 276 262 276 246 V70"
        fill="none" stroke="url(#glassEdge)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M239 72 V246 C239 260 150 282 150 362 C150 406 166 440 204 440 H308 C346 440 362 406 362 362 C362 282 273 260 273 246 V72"
        fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Fire-polished rim -->
  <rect x="228" y="58" width="56" height="14" rx="7" fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="3"/>
  <rect x="234" y="61" width="30" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Specular highlights -->
  <rect x="241" y="80" width="5" height="160" rx="2.5" fill="url(#specV)"/>
  <rect x="268" y="84" width="2.5" height="140" rx="1.25" fill="#ffffff" fill-opacity="0.45"/>
  <path d="M182 314 C162 342 160 380 170 414" fill="none" stroke="url(#specBulb)" stroke-width="14" stroke-linecap="round"/>
  <path d="M204 296 C194 304 188 312 184 320" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round"/>
  <path d="M336 326 C348 346 352 372 348 398" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  <circle cx="214" cy="290" r="3.5" fill="#ffffff" fill-opacity="0.95"/>
</svg>
